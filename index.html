<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HSK Multi-Level Audio Learning Studio</title>
  
  <!-- CẤU HÌNH GIAO DIỆN CHUẨN APP TRÊN ĐIỆN THOẠI (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Học Tiếng Trung">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .hanzi { font-family: 'Noto Sans SC', sans-serif; }
    .target-hl { color: #d97706; font-weight: 900; text-decoration: underline; text-underline-offset: 6px; }
    .active-card { ring: 3px solid #4f46e5; background-color: #eef2ff !important; }
  </style>
</head>
<body class="text-slate-800 pb-28">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span id="badge-current-level" class="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded-lg text-sm shadow-sm">HSK</span>
          <h1 class="font-bold text-slate-900 text-base sm:text-lg">Học Tiếng Trung Qua Audio Giảng Bài</h1>
        </div>

        <!-- BỘ LỌC 2 CẤP ĐỘ: CẤP ĐỘ HSK & DANH SÁCH BÀI HỌC -->
        <div class="flex flex-wrap items-center gap-1.5 bg-indigo-50 border border-indigo-200 p-1.5 rounded-xl shadow-sm">
          <!-- 1. Bộ lọc cấp độ HSK -->
          <div class="flex items-center gap-1.5 px-1.5">
            <label for="level-select" class="text-xs font-bold text-indigo-900 uppercase">🎯 HSK:</label>
            <select id="level-select" onchange="onSelectLevel(this.value)" class="bg-white border border-indigo-300 text-indigo-950 font-bold text-xs sm:text-sm rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="ALL">Tất cả</option>
              <option value="HSK1">HSK 1</option>
              <option value="HSK2" selected>HSK 2</option>
              <option value="HSK3">HSK 3</option>
              <option value="HSK4">HSK 4</option>
              <option value="HSK5">HSK 5</option>
            </select>
          </div>

          <!-- 2. Danh sách bài học tự động đổi theo cấp độ -->
          <div class="flex items-center gap-1.5 px-1.5 border-l border-indigo-200">
            <label for="lesson-select" class="text-xs font-bold text-indigo-900 uppercase">📚 Bài:</label>
            <select id="lesson-select" onchange="switchLesson(this.value)" class="bg-white border border-indigo-300 text-indigo-950 font-bold text-xs sm:text-sm rounded-lg px-2.5 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 max-w-[240px]">
            </select>
          </div>
        </div>
      </div>

      <!-- MENU TỰ ĐỘNG SINH CÁC NHÓM & CHẾ ĐỘ HỌC -->
      <nav id="main-nav" class="flex flex-wrap gap-1.5 text-xs sm:text-sm font-medium pt-1 border-t border-slate-100"></nav>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app-content" class="max-w-5xl mx-auto px-4 py-6"></main>

  <!-- STICKY GLOBAL AUDIO CONTROLLER -->
  <footer class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 text-white border-t border-slate-700 shadow-2xl">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0 flex-1">
        <div id="tts-indicator" class="w-3 h-3 rounded-full bg-slate-500 shrink-0"></div>
        <div class="truncate">
          <div id="tts-status-title" class="text-xs text-slate-400 font-medium">Trình phát giọng giảng song ngữ (vi-VN & zh-CN)</div>
          <div id="tts-current-text" class="text-sm font-semibold text-amber-300 truncate">Sẵn sàng phát âm thanh...</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="TTS.togglePause()" id="btn-play-pause" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs sm:text-sm font-semibold">⏯ Phát / Tạm dừng</button>
        <button onclick="TTS.replay()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs sm:text-sm">↺ Nghe lại</button>
        <button onclick="TTS.stop()" class="px-3 py-1.5 rounded-lg bg-rose-700 hover:bg-rose-600 text-xs sm:text-sm">⏹ Dừng</button>
        <select onchange="TTS.setRate(this.value)" class="bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-xs sm:text-sm text-white">
          <option value="0.75">0.75x (Chậm)</option>
          <option value="1.0" selected>1.0x (Chuẩn)</option>
          <option value="1.25">1.25x (Nhanh)</option>
        </select>
      </div>
    </div>
  </footer>

  <!-- ===================================================================== -->
  <!-- NẠP CÁC FILE DỮ LIỆU JAVASCRIPT HỌC LIỆU                               -->
  <!-- ===================================================================== -->
  <script src="lessons_hsk1.js"></script>
  <script src="lessons_hsk2.js"></script>
  <script src="lessons_hsk3.js"></script>
  <script src="lessons_hsk4.js"></script>
  <script src="lessons_hsk5.js"></script>
  <script src="lessons.js"></script>

  <!-- ===================================================================== -->
  <!-- BỘ MÁY XỬ LÝ GỘP DỮ LIỆU, AUDIO TTS & LOGIC GIAO DIỆN                   -->
  <!-- ===================================================================== -->
  <script>
    // 1. Tự động nhận diện cấp độ từ id hoặc title nếu bài học thiếu trường level
    function inferLessonLevel(lesson) {
      if (lesson.level) return lesson.level.toUpperCase();
      const text = `${lesson.id || ''} ${lesson.title || ''}`.toUpperCase();
      for (let i = 1; i <= 6; i++) {
        if (text.includes(`HSK${i}`) || text.includes(`HSK ${i}`)) return `HSK${i}`;
      }
      return "HSK2";
    }

    // 2. Tự động gộp tất cả các nguồn dữ liệu JavaScript thành một mảng duy nhất
    const COMBINED_LESSONS = [
      ...(typeof LESSONS_HSK1 !== 'undefined' && Array.isArray(LESSONS_HSK1) ? LESSONS_HSK1 : []),
      ...(typeof LESSONS_HSK2 !== 'undefined' && Array.isArray(LESSONS_HSK2) ? LESSONS_HSK2 : []),
      ...(typeof LESSONS_HSK3 !== 'undefined' && Array.isArray(LESSONS_HSK3) ? LESSONS_HSK3 : []),
      ...(typeof LESSONS_HSK4 !== 'undefined' && Array.isArray(LESSONS_HSK4) ? LESSONS_HSK4 : []),
      ...(typeof LESSONS_HSK5 !== 'undefined' && Array.isArray(LESSONS_HSK5) ? LESSONS_HSK5 : []),
      ...(typeof ALL_LESSONS !== 'undefined' && Array.isArray(ALL_LESSONS) ? ALL_LESSONS : [])
    ];

    const LESSONS_LIST = COMBINED_LESSONS.map(l => ({
      ...l,
      level: inferLessonLevel(l)
    }));

    let CURRENT_LEVEL = "HSK2";
    let CURRENT_LESSON = LESSONS_LIST.find(l => l.level === CURRENT_LEVEL) || LESSONS_LIST[0] || null;
    let APP_DATA_ACTIVE = { groups: CURRENT_LESSON ? (CURRENT_LESSON.groups || []) : [] };

    // =========================================================================
    // BỘ MÁY PHÁT ÂM SONG NGỮ (DUAL-LANGUAGE TTS QUEUE ENGINE)
    // =========================================================================
    const TTS = {
      queue: [],
      lastQueue: [],
      currentIndex: 0,
      isPlaying: false,
      isPaused: false,
      rate: 1.0,
      timer: null,
      onItemStart: null,
      onQueueEnd: null,

      setRate(newRate) {
        this.rate = parseFloat(newRate) || 1.0;
      },

      getBestVoice(langCode) {
        const voices = window.speechSynthesis.getVoices();
        const prefix = langCode.slice(0, 2).toLowerCase();
        return voices.find(v => v.lang.toLowerCase() === langCode.toLowerCase()) ||
               voices.find(v => v.lang.toLowerCase().startsWith(prefix)) || null;
      },

      playQueue(items, statusTitle = "Đang phát lời giảng...", onItemStart = null, onQueueEnd = null) {
        this.stop();
        if (!items || !items.length) return;
        this.queue = items.map(it => ({ ...it }));
        this.lastQueue = items.map(it => ({ ...it }));
        this.currentIndex = 0;
        this.isPlaying = true;
        this.isPaused = false;
        this.onItemStart = onItemStart;
        this.onQueueEnd = onQueueEnd;
        const titleEl = document.getElementById('tts-status-title');
        if (titleEl) titleEl.textContent = statusTitle;
        this.updateUIIndicator(true);
        this.processNext();
      },

      processNext() {
        if (!this.isPlaying || this.isPaused) return;
        if (this.currentIndex >= this.queue.length) {
          this.isPlaying = false;
          this.updateUIIndicator(false);
          const curText = document.getElementById('tts-current-text');
          if (curText) curText.textContent = "Đã phát xong.";
          if (typeof this.onQueueEnd === 'function') this.onQueueEnd();
          return;
        }

        const item = this.queue[this.currentIndex];
        if (typeof this.onItemStart === 'function') this.onItemStart(item, this.currentIndex);

        const cleanText = (item.text || "").replace(/\[.*?\]/g, "").trim();
        const curText = document.getElementById('tts-current-text');
        if (curText) {
          curText.textContent = `[${item.lang === 'zh-CN' ? 'Tiếng Trung' : 'Tiếng Việt'}] ${cleanText}`;
        }

        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = item.lang || "vi-VN";
        const matchedVoice = this.getBestVoice(utter.lang);
        if (matchedVoice) utter.voice = matchedVoice;
        utter.rate = this.rate;

        utter.onend = () => {
          if (!this.isPlaying || this.isPaused) return;
          const pauseMs = (typeof item.pause === 'number') ? item.pause : 300;
          this.timer = setTimeout(() => {
            this.currentIndex++;
            this.processNext();
          }, pauseMs);
        };

        utter.onerror = () => {
          this.currentIndex++;
          this.processNext();
        };

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      },

      togglePause() {
        if (!this.isPlaying && this.lastQueue.length > 0) {
          this.playQueue(this.lastQueue);
          return;
        }
        if (this.isPaused) {
          this.isPaused = false;
          window.speechSynthesis.resume();
          this.processNext();
          this.updateUIIndicator(true);
        } else {
          this.isPaused = true;
          clearTimeout(this.timer);
          window.speechSynthesis.cancel();
          this.updateUIIndicator(false, true);
        }
      },

      replay() {
        if (this.lastQueue.length > 0) {
          this.playQueue(this.lastQueue, "Phát lại...");
        }
      },

      stop() {
        clearTimeout(this.timer);
        this.isPlaying = false;
        this.isPaused = false;
        window.speechSynthesis.cancel();
        this.updateUIIndicator(false);
        const curText = document.getElementById('tts-current-text');
        if (curText) curText.textContent = "Đã dừng âm thanh.";
      },

      updateUIIndicator(playing, paused = false) {
        const dot = document.getElementById('tts-indicator');
        if (!dot) return;
        if (playing) {
          dot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping shrink-0";
        } else if (paused) {
          dot.className = "w-3 h-3 rounded-full bg-amber-400 shrink-0";
        } else {
          dot.className = "w-3 h-3 rounded-full bg-slate-500 shrink-0";
        }
      }
    };

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    // =========================================================================
    // STATE QUẢN LÝ TIẾN ĐỘ & TRẠNG THÁI HỌC TẬP
    // =========================================================================
    const STATE = {
      currentLessonId: CURRENT_LESSON ? CURRENT_LESSON.id : "empty",
      currentTab: 'guide',
      selectedWordIndexByGroup: {},
      completedExercises: JSON.parse(localStorage.getItem('hsk_completed_ex') || '{}'),
      masteredGroups: JSON.parse(localStorage.getItem('hsk_mastered_groups') || '{}'),
      unlockedHints: {},
      revealedTranscripts: {},
      trapCheckAnswers: {},
      reviewRevealed: {},
      passive: {
        mode: 'context',
        selectedGroups: {},
        zhRepeat: 2,
        shadowPause: 1500,
        order: 'sequential',
        loopAll: true,
        sleepMinutes: 0,
        sleepTimerId: null,
        wakeLock: null,
        isRunning: false,
        currentWord: null,
        currentSentence: ""
      }
    };

    function getLessonNumber(lesson) {
      const text = `${lesson.id || ''} ${lesson.title || ''}`.toLowerCase();
      const match = text.match(/(?:bài|bai|lesson)[^\d]*(\d+)/);
      if (match) return parseInt(match[1], 10);
      const fallback = text.match(/\d+/);
      return fallback ? parseInt(fallback[0], 10) : 999;
    }

    function updateLessonDropdown() {
      const selectEl = document.getElementById('lesson-select');
      if (!selectEl) return;

      let filtered = (CURRENT_LEVEL === "ALL")
        ? [...LESSONS_LIST]
        : LESSONS_LIST.filter(l => l.level === CURRENT_LEVEL);

      if (filtered.length === 0) {
        selectEl.innerHTML = `<option value="">(Chưa có bài học)</option>`;
        TTS.stop();
        CURRENT_LESSON = { id: "empty", level: CURRENT_LEVEL, title: `Cấp độ ${CURRENT_LEVEL} chưa có dữ liệu`, groups: [] };
        APP_DATA_ACTIVE = { groups: [] };
        STATE.currentLessonId = "empty";
        STATE.currentTab = 'guide';
        renderNav();
        renderApp();
        return;
      }

      filtered.sort((a, b) => getLessonNumber(a) - getLessonNumber(b));

      selectEl.innerHTML = filtered.map(l =>
        `<option value="${l.id}" ${l.id === STATE.currentLessonId ? 'selected' : ''}>${l.title}</option>`
      ).join('');

      const existsInFiltered = filtered.some(l => l.id === STATE.currentLessonId);
      if (!existsInFiltered) {
        switchLesson(filtered[0].id);
      } else {
        renderNav();
        renderApp();
      }
    }

    function onSelectLevel(level) {
      CURRENT_LEVEL = level;
      const badge = document.getElementById('badge-current-level');
      if (badge) badge.textContent = (level === 'ALL' ? 'HSK' : level);
      updateLessonDropdown();
    }

    function initLessonSelector() {
      if (CURRENT_LESSON && CURRENT_LESSON.level) {
        CURRENT_LEVEL = CURRENT_LESSON.level;
        const lvlEl = document.getElementById('level-select');
        if (lvlEl) lvlEl.value = CURRENT_LEVEL;
        const badge = document.getElementById('badge-current-level');
        if (badge) badge.textContent = CURRENT_LEVEL;
      }
      updateLessonDropdown();
    }

    function switchLesson(lessonId) {
      TTS.stop();
      const found = LESSONS_LIST.find(l => String(l.id) === String(lessonId));
      if (!found) return;
      CURRENT_LESSON = found;
      STATE.currentLessonId = found.id;
      APP_DATA_ACTIVE = { groups: found.groups || [] };
      STATE.selectedWordIndexByGroup = {};

      STATE.passive.selectedGroups = {};
      APP_DATA_ACTIVE.groups.forEach(g => {
        STATE.passive.selectedGroups[g.id] = true;
      });

      const groupExists = APP_DATA_ACTIVE.groups.some(g => g.id === STATE.currentTab);
      if (!['guide', 'review', 'passive', 'progress'].includes(STATE.currentTab) && !groupExists) {
        STATE.currentTab = 'guide';
      }

      const badge = document.getElementById('badge-current-level');
      if (badge && found.level) badge.textContent = found.level;

      renderNav();
      renderApp();
    }

    function getScopedKey(rawId) {
      return `${STATE.currentLessonId}_${rawId}`;
    }

    function saveProgress() {
      localStorage.setItem('hsk_completed_ex', JSON.stringify(STATE.completedExercises));
      localStorage.setItem('hsk_mastered_groups', JSON.stringify(STATE.masteredGroups));
    }

    function highlightTargetWord(sentence, targetWord) {
      if (!sentence || !targetWord) return sentence;
      const escaped = targetWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return sentence.replace(new RegExp(escaped, 'g'), `<span class="target-hl">${targetWord}</span>`);
    }

    // =========================================================================
    // ĐIỀU HƯỚNG THANH MENU ĐỘNG
    // =========================================================================
    function renderNav() {
      const nav = document.getElementById('main-nav');
      if (!nav) return;

      const hasGroups = APP_DATA_ACTIVE.groups && APP_DATA_ACTIVE.groups.length > 0;

      let html = `
        <button onclick="switchTab('guide')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${STATE.currentTab === 'guide' ? 'bg-indigo-600 text-white font-semibold shadow' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
          📖 Hướng dẫn
        </button>
      `;

      if (hasGroups) {
        APP_DATA_ACTIVE.groups.forEach((g, idx) => {
          const isAct = STATE.currentTab === g.id;
          html += `
            <button onclick="switchTab('${g.id}')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${isAct ? 'bg-indigo-600 text-white font-semibold shadow' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
              ${g.title ? g.title.split(':')[0] : `Nhóm ${idx + 1}`}
            </button>
          `;
        });

        html += `
          <button onclick="switchTab('review')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${STATE.currentTab === 'review' ? 'bg-amber-600 text-white font-semibold shadow' : 'bg-amber-100 text-amber-900 hover:bg-amber-200'}">
            🔄 Ôn tập (1-3-7 ngày)
          </button>
          <button onclick="switchTab('passive')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${STATE.currentTab === 'passive' ? 'bg-emerald-600 text-white font-semibold shadow' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
            🎧 Nghe Thụ Động
          </button>
          <button onclick="switchTab('progress')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${STATE.currentTab === 'progress' ? 'bg-indigo-600 text-white font-semibold shadow' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
            📊 Tiến độ
          </button>
        `;
      }

      nav.innerHTML = html;
    }

    function switchTab(tabId) {
      TTS.stop();
      STATE.currentTab = tabId;
      renderNav();
      renderApp();
    }

    // =========================================================================
    // RENDER NỘI DUNG TỔNG THỂ
    // =========================================================================
    function renderApp() {
      const container = document.getElementById('app-content');
      if (!container) return;

      if (!APP_DATA_ACTIVE.groups || APP_DATA_ACTIVE.groups.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl border border-slate-200 p-8 sm:p-12 text-center max-w-xl mx-auto space-y-4 shadow-sm my-6">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">📚</div>
            <h3 class="text-xl font-bold text-slate-900">Cấp độ ${CURRENT_LEVEL} đang được biên soạn!</h3>
            <p class="text-sm text-slate-500 leading-relaxed">
              Hiện tại chưa tìm thấy bài học nào cho cấp độ này. Hãy chọn cấp độ khác ở bộ lọc phía trên nhé.
            </p>
            <div class="pt-2">
              <button onclick="onSelectLevel('ALL')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow transition">
                Xem tất cả bài học ➔
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (STATE.currentTab === 'guide') {
        container.innerHTML = renderGuideTab();
      } else if (APP_DATA_ACTIVE.groups.some(g => g.id === STATE.currentTab)) {
        container.innerHTML = renderGroupTab(STATE.currentTab);
      } else if (STATE.currentTab === 'review') {
        container.innerHTML = renderReviewTab();
      } else if (STATE.currentTab === 'passive') {
        container.innerHTML = renderPassiveStudioTab();
      } else if (STATE.currentTab === 'progress') {
        container.innerHTML = renderProgressTab();
      } else {
        container.innerHTML = renderGuideTab();
      }
    }

    // TAB 1: HƯỚNG DẪN
    function renderGuideTab() {
      const totalLoadedWords = APP_DATA_ACTIVE.groups.reduce((acc, g) => acc + (g.words ? g.words.length : 0), 0);
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
          <div class="border-b border-slate-100 pb-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">${CURRENT_LESSON.level || 'HSK'} • ${CURRENT_LESSON.title}</span>
              <h2 class="text-2xl font-bold text-slate-900 mt-1">Hướng Dẫn Học Tiếng Trung Qua Audio Tương Tác</h2>
            </div>
            <button onclick="TTS.playQueue([{lang:'vi-VN', text:'Chào mừng bạn đến với ứng dụng học tiếng Trung qua Audio. Hãy chọn bài học để bắt đầu luyện nghe giảng.'}], 'Lời chào mở đầu')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow">
              🔊 Nghe giới thiệu phương pháp
            </button>
          </div>

          <div class="grid sm:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl bg-indigo-50/70 border border-indigo-100">
              <h3 class="font-bold text-indigo-950 mb-1">1. Nhớ Mặt Chữ Không Phụ Thuộc Pinyin</h3>
              <p class="text-sm text-slate-700">Pinyin có dấu chỉ xuất hiện duy nhất ở phần Giới thiệu từ mới (5.1). Toàn bộ ví dụ, phân tích ngữ pháp, bài tập và phần ôn tập đều hiển thị Chữ Hán nổi bật giúp kích hoạt ghi nhớ trực quan.</p>
            </div>
            <div class="p-4 rounded-xl bg-amber-50/70 border border-amber-100">

    // TAB 2: HỌC THEO TỪNG NHÓM
    function renderGroupTab(groupId) {
      const group = APP_DATA_ACTIVE.groups.find(g => g.id === groupId);
      if (!group) return `<div class="p-8 text-center text-slate-500">Nhóm không tồn tại.</div>`;

      const selfUseList = [];

    function selectWord(groupId, wordIdx) {

      STATE.selectedWordIndexByGroup[groupId] = wordIdx;

    function renderWordDetail(groupId, w) {

              ${w.structures.map((st, sIdx) => `
                <div class="p-3.5 rounded-lg bg-white border border-slate-200 space-y-1.5">
                  <div class="flex items-center justify-between">
                    <span class="font-semibold text-sm text-indigo-900">${st.title}</span>
                    <button onclick="playWordSection('${groupId}', ${w.index}, 'struct',${sIdx})" class="px-2.5 py-1 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold">🔊 Nghe khung câu</button>

          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
            <h4 class="font-bold text-slate-900">5.4. Ví dụ thực tế có phân tích (Chữ Hán rõ nét - Không Pinyin)</h4>
            <div class="grid gap-3">
              ${w.examples.map(ex => `
                <div class="p-3.5 rounded-lg bg-white border border-slate-200 flex items-center justify-between gap-4">
                  <div>
                    <div class="hanzi text-2xl font-bold text-slate-900 tracking-wide">${highlightTargetWord(ex.zh, w.hanzi)}</div>
                    <div class="text-sm text-slate-600 mt-1">${ex.vi}</div>
                  </div>
                  <button onclick="playSingleChineseExample('${ex.zh.replace(/'/g, "\\'")}', ${ex.pause || 2000})" class="shrink-0 px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-bold">
                    🔊 Nghe & Nhắc lại

              `).join('')}

          <!-- 5.5 BẪY VÀ PHÂN BIỆT -->
          <div class="p-4 rounded-xl bg-rose-50/70 border border-rose-200 space-y-3">
            <div class="flex items-center justify-between">
              <h4 class="font-bold text-rose-950">⚠️ 5.5. Bẫy thường gặp: ${w.trap.name}</h4>
              <button onclick="playWordSection('${groupId}', ${w.index}, 'trap')" class="px-3 py-1 rounded-lg bg-rose-200 hover:bg-rose-300 text-rose-950 text-xs font-semibold">🔊 Nghe phân tích bẫy</button>
            </div>

            <p class="text-sm text-slate-700"><strong>• Phân tích bản chất:</strong> ${w.trap.explanation}</p>
            <div class="grid sm:grid-cols-2 gap-2 pt-1">
              <div class="p-2.5 rounded-lg bg-rose-100/80 border border-rose-300 text-sm">
                <span class="font-bold text-rose-800">❌ Câu sai / Chưa tự nhiên:</span>
                <span class="hanzi font-bold text-rose-950 ml-1 text-base">${w.trap.wrong}</span>
              </div>
              <div class="p-2.5 rounded-lg bg-emerald-100/80 border border-emerald-300 text-sm">
                <span class="font-bold text-emerald-800">✅ Câu chuẩn xác:</span>
                <span class="hanzi font-bold text-emerald-950 ml-1 text-base">${highlightTargetWord(w.trap.right, w.hanzi)}</span>

            ${w.trap.checkQuestion ? `
              <div class="mt-3 pt-3 border-t border-rose-200 space-y-2">
                <div class="text-xs font-bold uppercase text-rose-800">${w.trap.checkQuestion.q}</div>
                <div class="flex flex-wrap gap-2">
                  ${w.trap.checkQuestion.options.map((opt, oIdx) => `
                    <button onclick="answerTrapCheck('${scopedWordKey}', ${oIdx})" class="px-3 py-1.5 rounded-lg border text-sm font-medium hanzi ${trapCheckState === oIdx ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white hover:bg-slate-50 border-slate-300'}">${opt}</button>
                  `).join('')}
                </div>
                ${trapCheckState !== undefined ? `
                  <div class="p-2.5 rounded-lg text-xs font-semibold ${trapCheckState === w.trap.checkQuestion.correct ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'}">
                    ${trapCheckState === w.trap.checkQuestion.correct ? '🎉 Chính xác! ' : '💡 Cần lưu ý: '} ${w.trap.checkQuestion.explain}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>

          <!-- 5.6, 5.7, 5.8: LUYỆN ĐỌC, MẶT CHỮ & TÓM TẮT -->
          <div class="grid sm:grid-cols-3 gap-4">
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="font-bold text-sm text-slate-900">5.6. Đọc đúng (Luyện nhắc)</h4>
                <button onclick="playWordSection('${groupId}', ${w.index}, 'pron')" class="px-2.5 py-1 rounded bg-emerald-600 text-white text-xs font-semibold">🔊 Luyện đọc</button>
              </div>
              <p class="text-xs text-slate-600">${w.pron.guide}</p>
            </div>

            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="font-bold text-sm text-slate-900">5.7. Nhớ mặt chữ</h4>
                <button onclick="playWordSection('${groupId}', ${w.index}, 'write')" class="px-2.5 py-1 rounded bg-indigo-100 text-indigo-800 text-xs font-semibold">🔊 Nghe mẹo</button>
              </div>
              <p class="text-xs text-slate-600">${w.write.desc}</p>
            </div>

            <div class="p-4 rounded-xl bg-indigo-50/70 border border-indigo-200 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="font-bold text-sm text-indigo-950">5.8. Chốt cách sử dụng</h4>
                <button onclick="TTS.playQueue([{lang:'vi-VN', text:'Tóm tắt cách dùng của từ: ' + '${w.summary.replace(/'/g, "\\'")}'}], 'Tóm tắt từ #${w.index}')" class="px-2 py-0.5 rounded bg-indigo-600 text-white text-xs font-semibold">🔊 Nghe</button>

            </div>
          </div>
        </div>
      `;
    }

    function answerTrapCheck(scopedWordKey, optionIndex) {
      STATE.trapCheckAnswers[scopedWordKey] = optionIndex;
      renderApp();
    }

    function playSingleChineseExample(zhSentence, pauseMs) {
      TTS.playQueue([
        { lang: "zh-CN", text: zhSentence, pause: pauseMs },
        { lang: "vi-VN", text: "Mời bạn nhắc lại câu vừa rồi." }
      ], `Nghe & Nhắc lại: ${zhSentence}`);
    }

    function playWordSection(groupId, wordIndex, section, subIdx = 0) {
      const group = APP_DATA_ACTIVE.groups.find(g => g.id === groupId);
      if (!group) return;
      const w = group.words.find(item => item.index === wordIndex);
      if (!w) return;

      if (section === 'intro') TTS.playQueue(w.introAudio, `Từ #${w.index} - Giới thiệu`);
      else if (section === 'meaning') TTS.playQueue(w.meaning.audio, `Từ #${w.index} - Hiểu nghĩa`);
      else if (section === 'struct') TTS.playQueue(w.structures[subIdx].audio, `Từ #${w.index} - Khung cấu trúc`);
      else if (section === 'trap') TTS.playQueue(w.trap.audio, `Từ #${w.index} - Phân tích bẫy`);
      else if (section === 'pron') TTS.playQueue(w.pron.audio, `Từ #${w.index} - Luyện đọc đúng`);
      else if (section === 'write') TTS.playQueue(w.write.audio, `Từ #${w.index} - Nhớ mặt chữ`);
    }

    function playSequentialWordLecture(groupId, wordIndex) {
      const group = APP_DATA_ACTIVE.groups.find(g => g.id === groupId);
      if (!group) return;
      const w = group.words.find(item => item.index === wordIndex);
      if (!w) return;

      const seqQueue = [];
      seqQueue.push(...w.introAudio);
      seqQueue.push(...w.meaning.audio);
      w.structures.forEach(st => seqQueue.push(...st.audio));
      seqQueue.push({ lang: "vi-VN", text: "Tiếp theo là các câu ví dụ thực tế:" });
      w.examples.forEach(ex => {
        seqQueue.push({ lang: "zh-CN", text: ex.zh, pause: 1200 });
        seqQueue.push({ lang: "vi-VN", text: ex.vi, pause: 600 });
      });
      seqQueue.push(...w.trap.audio);
      seqQueue.push(...w.write.audio);
      seqQueue.push({
        lang: "vi-VN",
        text: "Tóm tắt: " + w.summary + ". Đã kết thúc phần giảng lý thuyết. Hệ thống tự động dừng để bạn luyện nhắc lại hoặc trả lời câu hỏi kiểm tra."
      });

      TTS.playQueue(seqQueue, `Nghe giảng tuần tự: Từ #${w.index} (${w.hanzi})`);
    }

    function renderExerciseCard(groupId, ex, exIdx) {
      const scopedExKey = getScopedKey(ex.id);
      const userAns = STATE.completedExercises[scopedExKey];
      const hasAnswered = userAns !== undefined;
      const isCorrect = userAns === ex.correct;
      const transcriptVisible = hasAnswered || STATE.revealedTranscripts[scopedExKey];

      return `
        <div class="p-4 rounded-xl border ${hasAnswered ? (isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-amber-50/50 border-amber-200') : 'bg-slate-50 border-slate-200'} space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs font-bold uppercase px-2.5 py-0.5 rounded bg-indigo-100 text-indigo-800">Câu ${exIdx + 1}: ${ex.type}</span>
            <button onclick='TTS.playQueue(${JSON.stringify(ex.questionAudio)}, "Đề bài ${ex.id}")' class="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">
              🔊 Nghe câu hỏi ${ex.isListening ? '(Audio Nghe Hiểu)' : ''}
            </button>
          </div>

          <div class="hanzi font-semibold text-slate-900 text-base">${ex.prompt}</div>

          <div class="flex flex-wrap gap-2">
            ${ex.options.map((opt, oIdx) => `
              <button onclick="submitExercise('${groupId}', '${ex.id}',${oIdx})"
                class="px-4 py-2 rounded-xl border text-sm font-medium hanzi transition ${userAns === oIdx ? (isCorrect ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-rose-600 text-white border-rose-600') : 'bg-white hover:bg-slate-100 border-slate-300'}">
                ${opt}
              </button>
            `).join('')}
          </div>

          ${ex.isListening && !transcriptVisible ? `
            <div>
              <button onclick="revealTranscript('${scopedExKey}')" class="text-xs text-indigo-600 hover:underline font-medium">
                👁 Xem bản chép lời & Đáp án
              </button>
            </div>
          ` : ''}

          ${hasAnswered || transcriptVisible ? `
            <div class="pt-3 border-t border-slate-200/80 space-y-2 text-sm">

    function buildPassiveQueue() {
      const p = STATE.passive;
      let words = [];
      APP_DATA_ACTIVE.groups.forEach(g => {
        if (p.selectedGroups[g.id]) words.push(...g.words);
      });
      if (p.order === 'shuffle') {
        words = [...words].sort(() => Math.random() - 0.5);
      }

      const queue = [];
      words.forEach(w => {
        const pushZhRepeated = (text, sentenceDisplay = "") => {
          for (let i = 0; i < p.zhRepeat; i++) {
            queue.push({ lang: "zh-CN", text, pause: p.shadowPause, metaWord: w, metaSentence: sentenceDisplay });
          }
        };

        if (p.mode === 'quick') {
          pushZhRepeated(w.hanzi);
          queue.push({ lang: "vi-VN", text: w.coreMeaning, pause: 800, metaWord: w, metaSentence: "" });
        } else if (p.mode === 'context') {
          pushZhRepeated(w.hanzi);
          queue.push({ lang: "vi-VN", text: `${w.coreMeaning}. ${w.meaning.keyPoint}`, pause: 800, metaWord: w, metaSentence: "" });
          w.examples.forEach(ex => {
            pushZhRepeated(ex.zh, ex.zh);
            queue.push({ lang: "vi-VN", text: ex.vi, pause: 800, metaWord: w, metaSentence: ex.zh });
          });
        } else if (p.mode === 'podcast') {
          pushZhRepeated(w.hanzi);
          w.meaning.audio.forEach(a => queue.push({ ...a, metaWord: w, metaSentence: "" }));
          w.structures.forEach(st => st.audio.forEach(a => queue.push({ ...a, metaWord: w, metaSentence: st.pattern })));
          w.examples.forEach(ex => {
            pushZhRepeated(ex.zh, ex.zh);
            queue.push({ lang: "vi-VN", text: ex.vi, pause: 800, metaWord: w, metaSentence: ex.zh });
          });
          w.trap.audio.forEach(a => queue.push({ ...a, metaWord: w, metaSentence: w.trap.right }));
          queue.push({ lang: "vi-VN", text: "Tóm tắt: " + w.summary, pause: 1000, metaWord: w, metaSentence: "" });
        } else if (p.mode === 'zh_only') {
          pushZhRepeated(w.hanzi);
          w.examples.forEach(ex => pushZhRepeated(ex.zh, ex.zh));
        }
      });

      return queue;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          STATE.passive.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function startPassiveStudio() {
      const queue = buildPassiveQueue();
      if (!queue.length) {
        alert("Vui lòng chọn ít nhất 1 nhóm từ đã có dữ liệu!");
        return;
      }
      requestWakeLock();
      STATE.passive.isRunning = true;

      if (STATE.passive.sleepTimerId) clearTimeout(STATE.passive.sleepTimerId);
      if (STATE.passive.sleepMinutes > 0) {
        STATE.passive.sleepTimerId = setTimeout(() => {
          stopPassiveStudio();
        }, STATE.passive.sleepMinutes * 60 * 1000);
      }

      const runLoop = () => {
        TTS.playQueue(
          queue,
          "🎧 Đang phát Nghe Thụ Động...",
          (item) => {
            if (item.metaWord) {
              STATE.passive.currentWord = item.metaWord;
              STATE.passive.currentSentence = item.metaSentence || "";
              const hEl = document.getElementById('passive-big-hanzi');
              const mEl = document.getElementById('passive-big-meaning');
              const sEl = document.getElementById('passive-big-sentence');
              const bEl = document.getElementById('passive-progress-badge');
              if (hEl) hEl.textContent = item.metaWord.hanzi;
              if (mEl) mEl.textContent = item.metaWord.coreMeaning;
              if (sEl) sEl.innerHTML = highlightTargetWord(item.metaSentence || "", item.metaWord.hanzi);
              if (bEl) bEl.textContent = `Đang phát: Từ #${item.metaWord.index} (${item.metaWord.hanzi})`;
            }
          },
          () => {
            if (STATE.passive.isRunning && STATE.passive.loopAll) {
              runLoop();
            }
          }
        );
      };

      runLoop();
    }

    function stopPassiveStudio() {
      STATE.passive.isRunning = false;
      if (STATE.passive.sleepTimerId) clearTimeout(STATE.passive.sleepTimerId);
      if (STATE.passive.wakeLock) {
        STATE.passive.wakeLock.release().catch(() => {});
        STATE.passive.wakeLock = null;
      }
      TTS.stop();
    }

    function exportPassiveScript() {
      const queue = buildPassiveQueue();
      const lines = queue.map((item, idx) => `${idx + 1}. [${item.lang}] ${item.text} (Nghỉ ${item.pause || 300}ms)`);
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Kich_Ban_Podcast_${CURRENT_LESSON.id}_${STATE.passive.mode}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

          </div>

          <div class="grid sm:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-200">
              <div class="text-xs font-bold uppercase text-indigo-700">Bài tập tương tác đã hoàn thành</div>
              <div class="text-3xl font-black text-indigo-950 mt-1">${doneExercises} / ${totalExercises} câu</div>
            </div>
            <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
              <div class="text-xs font-bold uppercase text-emerald-700">Nhóm từ vựng đã thành thạo</div>
              <div class="text-3xl font-black text-emerald-950 mt-1">${masteredCount} / ${APP_DATA_ACTIVE.groups.length} nhóm</div>
            </div>
          </div>

          <div class="space-y-3">
            ${APP_DATA_ACTIVE.groups.map(g => `
              <div class="p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                <div>
                  <div class="font-bold text-slate-900">${g.title}</div>
                  <div class="text-xs text-slate-500">Gồm ${g.words.length} từ: ${g.words.map(w => w.hanzi).join(', ')}</div>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-bold ${STATE.masteredGroups[getScopedKey(g.id)] ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">
                  ${STATE.masteredGroups[getScopedKey(g.id)] ? '✅ Đã thành thạo' : '⏳ Chưa hoàn thành bài tập'}
                </span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Khởi chạy ứng dụng
    initLessonSelector();
  </script>
</body>
</html>
