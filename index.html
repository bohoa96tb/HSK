  <style>
    :root {

  <!-- ================= APPLICATION ENGINE SCRIPT ================= -->
  <script>
    /**
     * HSK AUDIO LEARNING WEB APP - CLIENT CORE ENGINE
     * Thiết kế thuần Vanilla JS, tối ưu hoàn toàn cho hợp đồng dữ liệu lesson_HSK1.js
     */

    // 1. CẤU HÌNH & HỆ THỐNG LƯU TRỮ (STORAGE)
    const APP_CONFIG = {
      STORAGE_KEY: 'HSK_STUDIO_PROGRESS_V3',
      SETTINGS_KEY: 'HSK_STUDIO_SETTINGS_V3',
      VERSION: 3.0
    };

    const Storage = {
      getSettings() {
        try {
          const raw = localStorage.getItem(APP_CONFIG.SETTINGS_KEY);
          return raw ? JSON.parse(raw) : {
            theme: 'system',
            fontSize: '16',
            rate: 1.0,
            voiceVi: '',
            voiceZh: '',
            autoAdvance: true
          };
        } catch (e) {
          return { theme: 'system', fontSize: '16', rate: 1.0, voiceVi: '', voiceZh: '', autoAdvance: true };
        }
      },
      saveSettings(settings) {
        try {
          localStorage.setItem(APP_CONFIG.SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) { console.error('Lỗi lưu cấu hình:', e); }
      },
      getProgress() {
        try {
          const raw = localStorage.getItem(APP_CONFIG.STORAGE_KEY);
          return raw ? JSON.parse(raw) : {
            version: APP_CONFIG.VERSION,
            completedWords: {},
            completedExercises: {},
            selfUseAnswers: {},
            notes: {},
            bookmarks: {},
            reviewsSchedule: {},
            lastLessonId: null,
            lastGroupId: null,
            lastWordId: null
          };
        } catch (e) {
          return { version: APP_CONFIG.VERSION, completedWords: {}, completedExercises: {}, selfUseAnswers: {}, notes: {}, bookmarks: {}, reviewsSchedule: {} };
        }
      },
      saveProgress(data) {
        try {
          localStorage.setItem(APP_CONFIG.STORAGE_KEY, JSON.stringify(data));
        } catch (e) { console.error('Lỗi lưu tiến độ:', e); }
      },
      exportBackupJSON() {
        const payload = {
          version: APP_CONFIG.VERSION,
          exportedAt: new Date().toISOString(),
          settings: this.getSettings(),
          progress: this.getProgress()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HSK_TienDoHocTap_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      },
      importBackupJSON(jsonString) {
        try {
          const parsed = JSON.parse(jsonString);
          if (!parsed.progress) throw new Error("Tệp không đúng định dạng sao lưu hợp lệ.");
          this.saveProgress(parsed.progress);
          if (parsed.settings) this.saveSettings(parsed.settings);
          return { success: true };
        } catch (err) {
          return { success: false, error: err.message };
        }
      },
      resetAll() {
        localStorage.removeItem(APP_CONFIG.STORAGE_KEY);
      }
    };

    // 2. CHUẨN HÓA DỮ LIỆU HỌC LIỆU (DATA NORMALIZER)
    const DataNormalizer = {
      findRawLessons() {
        if (typeof ALL_LESSONS !== 'undefined' && Array.isArray(ALL_LESSONS)) return ALL_LESSONS;
        if (typeof window.ALL_LESSONS !== 'undefined' && Array.isArray(window.ALL_LESSONS)) return window.ALL_LESSONS;
        if (typeof LESSONS_HSK1 !== 'undefined' && Array.isArray(LESSONS_HSK1)) return LESSONS_HSK1;
        if (typeof window.LESSONS_HSK1 !== 'undefined' && Array.isArray(window.LESSONS_HSK1)) return window.LESSONS_HSK1;
        return null;
      },

      normalizeLesson(rawLesson, index) {
        if (!rawLesson) return null;
        const lessonId = String(rawLesson.id || `lesson_${index + 1}`);
        const title = rawLesson.title || `Bài học ${index + 1}`;
        const level = (rawLesson.level || "HSK1").toUpperCase();

        const groups = (rawLesson.groups || []).map((grp, gIdx) => {
          const groupId = String(grp.id || `${lessonId}_g${gIdx + 1}`);
          const gTitle = grp.title || `Nhóm ${gIdx + 1}`;
          const gDesc = grp.desc || '';

          // Chuẩn hóa danh sách từ vựng
          const words = (grp.words || []).map((w, wIdx) => {
            const wordId = String(w.id || `${groupId}_w${wIdx + 1}`);
            const hanzi = w.hanzi || '';
            const pinyin = w.pinyin || '';
            const coreMeaning = w.coreMeaning || 'Chưa có giải nghĩa chính';

            // Intro audio
            const introAudio = Array.isArray(w.introAudio) ? w.introAudio : [
              { lang: "zh-CN", text: hanzi, pause: 400 },
              { lang: "vi-VN", text: coreMeaning, pause: 300 }
            ];

            // 5.2 Hiểu nghĩa
            const meaning = {
              situation: (w.meaning && w.meaning.situation) || 'Dùng trong giao tiếp thường nhật.',
              detail: (w.meaning && w.meaning.detail) || '',
              keyPoint: (w.meaning && w.meaning.keyPoint) || coreMeaning,
              audio: (w.meaning && Array.isArray(w.meaning.audio)) ? w.meaning.audio : []
            };

            // 5.3 Cấu trúc / Khung câu
            const structures = Array.isArray(w.structures) ? w.structures.map(st => ({
              title: st.title || 'Cách dùng cơ bản',
              pattern: st.pattern || hanzi,
              note: st.note || '',
              audio: Array.isArray(st.audio) ? st.audio : []
            })) : [];

            // 5.4 Ví dụ thực tế
            const examples = Array.isArray(w.examples) ? w.examples.map(ex => ({
              zh: ex.zh || '',
              vi: ex.vi || '',
              situation: ex.situation || '',
              analysis: ex.analysis || '',
              explainAudio: Array.isArray(ex.explainAudio) ? ex.explainAudio : []
            })) : [];

            // 5.5 Bẫy ngữ pháp (Hỗ trợ cả traps mảng và trap đơn)
            const trapsList = [];
            if (Array.isArray(w.traps)) {
              trapsList.push(...w.traps);
            } else if (w.trap && typeof w.trap === 'object') {
              trapsList.push(w.trap);
            }

            const uniqueTraps = [];
            const seenTrapNames = new Set();
            trapsList.forEach(t => {
              const name = t.name || 'Bẫy thường gặp';
              if (!seenTrapNames.has(name)) {
                seenTrapNames.add(name);
                uniqueTraps.push({
                  name: name,
                  situation: t.situation || '',
                  explanation: t.explanation || '',
                  wrong: t.wrong || '',
                  right: t.right || '',
                  tip: t.tip || '',
                  boundary: t.boundary || '',
                  comparisons: Array.isArray(t.comparisons) ? t.comparisons : [],
                  checkQuestion: t.checkQuestion && typeof t.checkQuestion === 'object' ? {
                    q: t.checkQuestion.q || '',
                    options: Array.isArray(t.checkQuestion.options) ? t.checkQuestion.options : [],
                    correct: typeof t.checkQuestion.correct === 'number' ? t.checkQuestion.correct : 0,
                    explain: t.checkQuestion.explain || ''
                  } : null,
                  audio: Array.isArray(t.audio) ? t.audio : []
                });
              }
            });

            // 5.6 Phát âm & 5.7 Mặt chữ & 5.8 Chốt dùng
            const pron = {
              guide: (w.pron && w.pron.guide) || 'Luyện đọc tròn vành rõ thanh điệu.',
              audio: (w.pron && Array.isArray(w.pron.audio)) ? w.pron.audio : []
            };
            const write = {
              desc: (w.write && w.write.desc) || 'Quan sát nét bút và cấu tạo bộ thủ.',
              audio: (w.write && Array.isArray(w.write.audio)) ? w.write.audio : []
            };
            const summary = typeof w.summary === 'string' ? w.summary : 'Nắm vững bản chất và bối cảnh sử dụng của từ.';
            const summaryAudio = Array.isArray(w.summaryAudio) ? w.summaryAudio : [];

            return {
              id: wordId,
              index: w.index || wIdx + 1,
              hanzi,
              pinyin,
              coreMeaning,
              introAudio,
              meaning,
              structures,
              examples,
              traps: uniqueTraps,
              pron,
              write,
              summary,
              summaryAudio
            };
          });

          // Chuẩn hóa bài tập trắc nghiệm & nghe hiểu
          const exercises = Array.isArray(grp.exercises) ? grp.exercises.map((ex, exIdx) => ({
            id: String(ex.id || `${groupId}_ex${exIdx + 1}`),
            type: ex.type || 'Trắc nghiệm',
            prompt: ex.prompt || ex.q || 'Chọn đáp án đúng nhất:',
            options: Array.isArray(ex.options) ? ex.options : [],
            correct: typeof ex.correct === 'number' ? ex.correct : 0,
            reasonRight: ex.reasonRight || 'Chính xác theo quy tắc ngữ pháp.',
            reasonWrong: ex.reasonWrong || 'Chưa đúng, hãy xem lại bản chất của từ.',
            transcript: ex.transcript || '',
            isListening: Boolean(ex.isListening || ex.listenAudio),
            questionAudio: Array.isArray(ex.questionAudio) ? ex.questionAudio : (Array.isArray(ex.listenAudio) ? ex.listenAudio : []),
            explainAudio: Array.isArray(ex.explainAudio) ? ex.explainAudio : []
          })) : [];

          // Chuẩn hóa phần Tự Dùng Từ (3 Tầng gợi ý)
          const rawSelfList = [];
          if (Array.isArray(grp.selfUse)) rawSelfList.push(...grp.selfUse);
          else if (grp.selfUse && typeof grp.selfUse === 'object') rawSelfList.push(grp.selfUse);

          const selfUse = rawSelfList.map((s, sIdx) => ({
            id: String(s.id || `${groupId}_su${sIdx + 1}`),
            situation: s.situation || 'Tự đặt câu dựa theo ngữ cảnh bài học:',
            hint1: s.hint1 || 'Xác định ý định giao tiếp chính.',
            hint2: s.hint2 || 'Sử dụng cấu trúc vừa học.',
            modelAnswer: s.modelAnswer || '',
            modelExplain: s.modelExplain || '',
            questionAudio: Array.isArray(s.questionAudio) ? s.questionAudio : [],
            hint1Audio: Array.isArray(s.hint1Audio) ? s.hint1Audio : [],
            hint2Audio: Array.isArray(s.hint2Audio) ? s.hint2Audio : [],
            modelAudio: Array.isArray(s.modelAudio) ? s.modelAudio : []
          }));

          // Chuẩn hóa câu hỏi ôn tập ngắt quãng 1-3-7 ngày
          const reviews = Array.isArray(grp.reviews) ? grp.reviews.map((r, rIdx) => ({
            id: String(r.id || `${groupId}_rev${rIdx + 1}`),
            day: r.day || 1,
            type: r.type || 'Nhớ nghĩa & phản xạ',
            q: r.q || r.prompt || '',
            answer: r.answer || '',
            explain: r.explain || '',
            listenAudio: Array.isArray(r.listenAudio) ? r.listenAudio : [],
            audio: Array.isArray(r.audio) ? r.audio : []
          })) : [];

          return {
            id: groupId,
            title: gTitle,
            desc: gDesc,
            words,
            exercises,
            selfUse,
            reviews
          };
        });

        return {
          id: lessonId,
          title,
          level,
          groups
        };
      }
    };

    // 3. BỘ ĐIỀU PHỐI ÂM THANH DUAL-LANGUAGE TTS ENGINE
    const TTS = {
      queue: [],
      currentIndex: 0,
      isPlaying: false,
      isPaused: false,
      token: 0,
      timer: null,
      currentUtterance: null,
      rates: [0.75, 0.9, 1.0, 1.15, 1.25],

      init() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => this.getVoices();
        }
      },

      getVoices() {
        if (!('speechSynthesis' in window)) return [];
        return window.speechSynthesis.getVoices() || [];
      },

      findBestVoice(langCode) {
        const voices = this.getVoices();
        const settings = Storage.getSettings();

        if (langCode.startsWith('vi') && settings.voiceVi) {
          const match = voices.find(v => v.voiceURI === settings.voiceVi);
          if (match) return match;
        }
        if (langCode.startsWith('zh') && settings.voiceZh) {
          const match = voices.find(v => v.voiceURI === settings.voiceZh);
          if (match) return match;
        }

        const exact = voices.find(v => v.lang.replace('_', '-').toLowerCase() === langCode.toLowerCase());
        if (exact) return exact;
        return voices.find(v => v.lang.toLowerCase().startsWith(langCode.slice(0, 2).toLowerCase())) || null;
      },

      playQueue(items, title = "Đang giảng bài...") {
        if (typeof Passive !== 'undefined') Passive.halt(true);
        this.stop();
        if (!items || !items.length) return;
        if (!('speechSynthesis' in window)) {
          this.setUIStatus("Thiết bị không hỗ trợ Web Speech API.", false);
          return;
        }

        this.queue = items.map(it => ({ ...it }));
        this.currentIndex = 0;
        this.isPlaying = true;
        this.isPaused = false;
        this.token++;

        this.setDockVisible(true);
        this.setUIStatus(title, true);
        this.processNext();
      },

      processNext() {
        if (!this.isPlaying || this.isPaused) return;

        if (this.currentIndex >= this.queue.length) {
          this.isPlaying = false;
          this.setUIStatus("Đã phát xong lời giảng.", false);
          this.updateLED('stopped');
          return;
        }

        const localToken = this.token;
        const item = this.queue[this.currentIndex];
        const cleanText = String(item.text || '').replace(/\[.*?\]/g, '').trim();

        if (!cleanText) {
          this.currentIndex++;
          this.processNext();
          return;
        }

        const lang = item.lang || 'vi-VN';
        const langLabel = lang.startsWith('zh') ? '🇨🇳 Tiếng Trung' : '🇻🇳 Tiếng Việt';
        const captionBar = document.getElementById('audio-caption-bar');
        if (captionBar) captionBar.textContent = `[${langLabel}] ${cleanText}`;

        const utter = new SpeechSynthesisUtterance(cleanText);
        this.currentUtterance = utter;
        utter.lang = lang;

        const voice = this.findBestVoice(lang);
        if (voice) utter.voice = voice;

        const settings = Storage.getSettings();
        utter.rate = Number(settings.rate) || 1.0;

        const stepToNext = () => {
          if (localToken !== this.token || !this.isPlaying || this.isPaused) return;
          const pauseMs = typeof item.pause === 'number' ? Math.max(0, item.pause) : 350;
          this.timer = setTimeout(() => {
            if (localToken !== this.token) return;
            this.currentIndex++;
            this.processNext();
          }, pauseMs);
        };

        utter.onend = stepToNext;
        utter.onerror = (e) => {
          if (e.error === 'canceled' || e.error === 'interrupted') return;
          console.warn("TTS Error:", e.error);
          stepToNext();
        };

        this.updateLED('playing');
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      },

      togglePause() {
        if (!this.isPlaying) return;
        if (this.isPaused) {
          this.isPaused = false;
          window.speechSynthesis.resume();
          this.updateLED('playing');
          const lbl = document.getElementById('label-audio-playpause');
          if (lbl) lbl.textContent = "⏸ Tạm dừng";
          this.processNext();
        } else {
          this.isPaused = true;
          this.token++;
          clearTimeout(this.timer);
          window.speechSynthesis.cancel();
          this.updateLED('paused');
          const lbl = document.getElementById('label-audio-playpause');
          if (lbl) lbl.textContent = "▶ Tiếp tục";
        }
      },

      replay() {
        if (this.queue.length > 0) {
          this.playQueue(this.queue, "Phát lại đoạn giảng...");
        }
      },

      stop() {
        this.token++;
        clearTimeout(this.timer);
        this.isPlaying = false;
        this.isPaused = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        this.updateLED('stopped');
        this.setUIStatus("Đã dừng âm thanh.", false);
        const lbl = document.getElementById('label-audio-playpause');
        if (lbl) lbl.textContent = "▶ Phát";
      },

      cycleRate() {
        const settings = Storage.getSettings();
        let curRate = Number(settings.rate) || 1.0;
        let nextIdx = (this.rates.indexOf(curRate) + 1) % this.rates.length;
        if (nextIdx < 0) nextIdx = 2;
        const newRate = this.rates[nextIdx];
        settings.rate = newRate;
        Storage.saveSettings(settings);
        const btn = document.getElementById('btn-audio-rate');
        if (btn) btn.textContent = `${newRate}×`;
      },

      setDockVisible(visible) {
        const dock = document.getElementById('audio-dock');
        if (!dock) return;
        if (visible) dock.classList.remove('translate-y-24', 'opacity-0');
        else dock.classList.add('translate-y-24', 'opacity-0');
      },

      setUIStatus(title, isPlaying) {
        const tEl = document.getElementById('audio-title-bar');
        if (tEl) tEl.textContent = title;
      },

      updateLED(state) {
        const led = document.getElementById('audio-status-led');
        if (!led) return;
        if (state === 'playing') led.className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping shrink-0";
        else if (state === 'paused') led.className = "w-3 h-3 rounded-full bg-amber-400 shrink-0";
        else led.className = "w-3 h-3 rounded-full bg-slate-500 shrink-0";
      }
    };

    // 4. BỘ ĐIỀU HƯỚNG & QUẢN LÝ DỮ LIỆU (ROUTER & STORE)
    const AppStore = {
      lessons: [],
      currentLesson: null,
      currentGroup: null,
      currentWord: null,
      currentTab: 'home',
      searchQuery: ''
    };

    const Router = {
      navigate(tab, params = {}) {
        TTS.stop();
        if (tab !== 'passive') Passive.halt(true);
        const dockEl = document.getElementById('audio-dock');
        if (dockEl) dockEl.classList.toggle('hidden', tab === 'passive');
        AppStore.currentTab = tab;

        if (params.lessonId) {
          const l = AppStore.lessons.find(item => item.id === params.lessonId);
          if (l) AppStore.currentLesson = l;
        }
        if (params.groupId && AppStore.currentLesson) {
          const g = AppStore.currentLesson.groups.find(item => item.id === params.groupId);
          if (g) AppStore.currentGroup = g;
        }
        if (params.wordId && AppStore.currentGroup) {
          const w = AppStore.currentGroup.words.find(item => item.id === params.wordId);
          if (w) AppStore.currentWord = w;
        }

        const progress = Storage.getProgress();
        if (AppStore.currentLesson) progress.lastLessonId = AppStore.currentLesson.id;
        if (AppStore.currentGroup) progress.lastGroupId = AppStore.currentGroup.id;
        if (AppStore.currentWord) progress.lastWordId = AppStore.currentWord.id;
        Storage.saveProgress(progress);

        this.updateNavButtons(tab);
        Renderer.renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      updateNavButtons(tab) {
        ['home', 'lesson', 'passive', 'exercise', 'review', 'settings'].forEach(b => {
          const el = document.getElementById(`nav-btn-${b}`);
          if (!el) return;
          el.className = 'nav-item' + (b === tab ? ' on' : '');
        });
      }
    };

    // 5. BỘ TRÌNH DIỄN GIAO DIỆN (VIEW RENDERER)
    const Renderer = {
      escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      },

      highlightWord(sentence, target) {
        if (!sentence || !target) return this.escapeHtml(sentence);
        const safe = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`(${safe})`, 'g');
        return this.escapeHtml(sentence).replace(re, `<span class="target-word-hl">$1</span>`);
      },

      renderCurrentView() {
        const viewport = document.getElementById('app-viewport');
        if (!viewport) return;

        if (!AppStore.lessons || AppStore.lessons.length === 0) {
          viewport.innerHTML = this.renderEmptyDataNotice();
          return;
        }

        switch (AppStore.currentTab) {
          case 'home':
            viewport.innerHTML = this.renderHomeView();
            break;
          case 'lesson':
            viewport.innerHTML = this.renderLessonView();
            break;
          case 'exercise':
            viewport.innerHTML = this.renderExerciseView();
            break;
          case 'review':
            viewport.innerHTML = this.renderReviewView();
            break;
          case 'search':
            viewport.innerHTML = this.renderSearchView();
            break;
          case 'settings':
            viewport.innerHTML = this.renderSettingsView();
            break;
          case 'passive':
            viewport.innerHTML = this.renderPassiveView();
            Passive.syncUI();
            break;
          default:
            viewport.innerHTML = this.renderHomeView();
        }
      },

      renderEmptyDataNotice() {
        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 sm:p-12 text-center max-w-lg mx-auto my-8 shadow-sm">
            <div class="w-16 h-16 bg-rose-100 dark:bg-rose-900/40 text-rose-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
              ⚠️
            </div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Chưa tìm thấy tệp bài học</h2>
            <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">
              Vui lòng đặt tệp học liệu <code>lesson_HSK1.js</code> cùng thư mục với tệp <code>index.html</code> này. Tệp cần chứa mảng <code>ALL_LESSONS</code>.
            </p>
            <button onclick="location.reload()" class="touch-target px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow">
              Tải lại trang ⟳
            </button>
          </div>
        `;
      },

      // === A. TRANG CHỦ ===
      renderHomeView() {
        const progress = Storage.getProgress();
        const totalWords = AppStore.lessons.reduce((acc, l) => acc + l.groups.reduce((gAcc, g) => gAcc + g.words.length, 0), 0);
        const learnedWordsCount = Object.keys(progress.completedWords || {}).length;
        const pct = totalWords ? Math.round(learnedWordsCount / totalWords * 100) : 0;
        const C = 2 * Math.PI * 34;

        const now = Date.now();
        let dueReviewCount = 0;
        Object.values(progress.reviewsSchedule || {}).forEach(r => {
          if (r.dueDate && r.dueDate <= now) dueReviewCount++;
        });

        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const gradients = [
          'from-indigo-500 to-violet-600', 'from-sky-500 to-indigo-600',
          'from-fuchsia-500 to-pink-600', 'from-emerald-500 to-teal-600'
        ];

        return `
          <div class="space-y-5">
            <!-- Hero -->
            <section class="relative overflow-hidden rounded-3xl p-6 sm:p-8 text-white" style="background:linear-gradient(135deg,#4338ca,#6d28d9 55%,#be185d);box-shadow:0 28px 50px -26px rgba(76,29,149,.9)">
              <div class="hanzi-text absolute -right-4 -top-8 text-[9rem] font-black leading-none opacity-10 select-none">汉</div>
              <div class="relative flex items-center justify-between gap-4">
                <div class="min-w-0">
                  <div class="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider text-indigo-100 bg-white/15 rounded-full px-3 py-1 mb-3">
                    ${this.escapeHtml(curLesson.level)} • Học âm thanh tương tác
                  </div>
                  <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-tight mb-2">${this.escapeHtml(curLesson.title)}</h2>
                  <p class="text-sm text-indigo-100/90 max-w-md leading-relaxed">
                    Nghe giảng từng từ, phân tích ví dụ, tránh bẫy ngữ pháp của người Việt, hoặc bật nghe rảnh tay mọi lúc.
                  </p>
                </div>
                <div class="relative shrink-0 w-24 h-24 sm:w-28 sm:h-28">
                  <svg viewBox="0 0 80 80" class="w-full h-full -rotate-90">
                    <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="7"></circle>
                    <circle cx="40" cy="40" r="34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
                      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"></circle>
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center leading-none">
                    <span class="text-2xl font-black">${pct}%</span>
                    <span class="text-[10px] font-semibold text-indigo-100 mt-1">${learnedWordsCount}/${totalWords} từ</span>
                  </div>
                </div>
              </div>
            </section>

            <!-- Lối tắt -->
            <section class="grid grid-cols-3 gap-3">
              <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}' })" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center">
                <div class="text-2xl mb-1">📖</div>
                <div class="text-xs font-extrabold text-slate-900 dark:text-white">Học tiếp</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">Nghe giảng</div>
              </button>
              <button onclick="Router.navigate('passive')" class="relative rounded-2xl p-4 text-center text-white" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 14px 28px -14px rgba(99,102,241,.9)">
                <div class="text-2xl mb-1">🎧</div>
                <div class="text-xs font-extrabold">Nghe thụ động</div>
                <div class="text-[11px] text-indigo-100">Rảnh tay</div>
              </button>
              <button onclick="Router.navigate('review')" class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center">
                ${dueReviewCount > 0 ? `<span class="absolute top-2 right-2 min-w-[20px] h-5 px-1.5 rounded-full bg-amber-500 text-white text-[11px] font-black flex items-center justify-center">${dueReviewCount}</span>` : ''}
                <div class="text-2xl mb-1">🔁</div>
                <div class="text-xs font-extrabold text-slate-900 dark:text-white">Ôn 1-3-7</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">${dueReviewCount} từ đến hạn</div>
              </button>
            </section>

            <!-- Số liệu -->
            <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                <div class="text-[11px] font-bold uppercase text-slate-400">Từ đã học</div>
                <div class="text-2xl font-black text-slate-900 dark:text-white mt-1">${learnedWordsCount} <span class="text-xs font-normal text-slate-400">/ ${totalWords}</span></div>
              </div>
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">

                ${curLesson.groups.map((g, gIdx) => {
                  const total = g.words.length;
                  const done = g.words.filter(w => progress.completedWords[w.id]).length;
                  const p = total ? Math.round(done / total * 100) : 0;
                  const preview = g.words.slice(0, 6).map(w => w.hanzi).join(' · ');
                  return `

                      <div class="flex items-start gap-3">

                          <h4 class="text-sm font-extrabold text-slate-900 dark:text-white leading-snug">${this.escapeHtml(g.title)}</h4>

                      <div class="mt-3 flex items-center gap-3">

                        <span class="text-[11px] font-semibold text-slate-500">${done}/${total}</span>
                      </div>
                    </div>`;
                }).join('')}
              </div>
            </section>
          </div>
        `;

                  <div id="ps-caption" class="hanzi-text glass rounded-2xl px-4 py-3 text-sm text-amber-200 font-semibold text-center min-h-[3rem] flex items-center justify-center leading-snug">

                  <div class="mt-4 h-1.5 rounded-full bg-white/15 overflow-hidden"><div id="ps-progress" class="h-full rounded-full bg-gradient-to-r from-sky-300 to-fuchsia-300" style="width:0%"></div></div>

                  </div>

                  <div class="flex items-center justify-between gap-2 mt-5">
                    <div class="flex items-center gap-1.5">
                      ${[0.75, 0.9, 1.0, 1.15, 1.25].map(r => `<button onclick="Passive.setRate(${r})" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold ${Math.abs(rate - r) < 0.01 ? 'bg-white text-indigo-700' : 'bg-white/10 text-indigo-100'}">${r}×</button>`).join('')}

              <!-- ===== TÙY CHỌN ===== -->

                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5">
                  <div class="opt-label mb-3">1 · Chế độ nghe</div>
                  <div class="grid sm:grid-cols-2 gap-2.5">
                    ${modes.map(m => `
                      <button class="mode-card ${c.mode === m.v ? 'on' : ''}" onclick="Passive.setCfg('mode', ${m.v})">
                        <div class="text-sm font-extrabold text-slate-900 dark:text-white">${m.icon} ${m.t}</div>

                      <button class="chip ${allSelected ? 'on' : ''}" onclick="Passive.selectAllGroups()">Tất cả ${all.length} từ</button>

                        const on = !allSelected && scoped.some(x => x.gid === g.id);
                        return `<button class="chip ${on ? 'on' : ''}" onclick="Passive.toggleGroup('${g.id}')">Nhóm ${i + 1} <span class="opacity-70">(${g.words.length})</span></button>`;

                    <div class="flex flex-wrap gap-2">${seg('repeat', [{ v: 1, label: '1 lần' }, { v: 2, label: '2 lần' }, { v: 3, label: '3 lần' }])}</div>

                  <div class="${podcast ? 'opacity-50' : ''}">

                  <div>

                        <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${this.escapeHtml(x.w.pinyin)} · ${this.escapeHtml(x.w.coreMeaning)}</div>

            </div>

      // === B. MÀN HÌNH BÀI HỌC & CHI TIẾT TỪ VỰNG ===
      renderLessonView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const curGroup = AppStore.currentGroup || curLesson.groups[0];
        const curWord = AppStore.currentWord || (curGroup ? curGroup.words[0] : null);

        if (!curGroup || !curWord) {
          return `<div class="p-8 text-center text-slate-500">Bài học này chưa có nội dung nhóm.</div>`;
        }

        const wordIdxInGroup = curGroup.words.findIndex(w => w.id === curWord.id);
        const prevWord = wordIdxInGroup > 0 ? curGroup.words[wordIdxInGroup - 1] : null;
        const nextWord = wordIdxInGroup < curGroup.words.length - 1 ? curGroup.words[wordIdxInGroup + 1] : null;

        const progress = Storage.getProgress();
        const isCompleted = Boolean(progress.completedWords[curWord.id]);
        const isBookmarked = Boolean(progress.bookmarks[curWord.id]);

        return `
          <div class="space-y-6">
            <!-- Navigation Header -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">

                </div>
                <!-- Dropdown đổi nhóm nhanh -->
                <select onchange="Renderer.onSelectGroup(this.value)" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  ${curLesson.groups.map(g => `
                    <option value="${g.id}" ${g.id === curGroup.id ? 'selected' : ''}>${g.title}</option>

              <div class="flex items-center gap-2 overflow-x-auto pb-1">
                ${curGroup.words.map((w) => `
                  <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}', groupId: '${curGroup.id}', wordId: '${w.id}' })"

                    <span class="opacity-75">#${w.index}</span>
                    <span class="hanzi-text font-bold text-sm">${w.hanzi}</span>
                  </button>

                    <span class="hanzi-text text-4xl sm:text-5xl font-black text-indigo-600 dark:text-indigo-400">${curWord.hanzi}</span>
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-slate-400 uppercase">Từ #${curWord.index}</span>
                      <button onclick="Renderer.toggleBookmark('${curWord.id}')" class="text-sm ${isBookmarked ? 'text-amber-500' : 'text-slate-300 dark:text-slate-600'} hover:scale-110 transition" title="Đánh dấu từ quan trọng">

                          ${Renderer.highlightWord(ex.zh, curWord.hanzi)}
                        </div>
                        <details class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 cursor-pointer">
                          <summary class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">👁 Xem nghĩa tiếng Việt & Phân tích</summary>
                          <div class="pt-1 font-medium text-slate-800 dark:text-slate-200">${ex.vi}</div>${ex.analysis ? `<div class="text-[11px] text-slate-500 mt-1">${ex.analysis}</div>` : ''}
                        </details>
                      </div>
                      <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                        ${ex.explainAudio && ex.explainAudio.length ? `
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.explainAudio)}, 'Phân tích ví dụ')" class="touch-target px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-semibold">
                            🔊 Lời giảng
                          </button>
                        ` : ''}
                        <button onclick="TTS.playQueue([{lang:'zh-CN', text:${JSON.stringify(ex.zh)}, pause:1500}, {lang:'vi-VN', text:'Mời bạn nhắc lại.'}], 'Nghe câu ví dụ')" class="touch-target px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 text-emerald-800 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-800 text-xs font-bold">
                          🔊 Nghe & Nhại
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 5.5 BẪY VÀ PHÂN BIỆT (TRAPS & DISTINCTIONS) -->
              ${curWord.traps.length > 0 ? `
                <div class="space-y-3">
                  <h4 class="font-bold text-sm text-rose-700 dark:text-rose-400">⚠️ 5.5. Bẫy người Việt hay mắc & Cách phân biệt</h4>
                  <div class="grid gap-4">
                    ${curWord.traps.map((t, tIdx) => `
                      <div class="p-4 sm:p-5 rounded-2xl bg-rose-50/70 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900/60 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="font-bold text-rose-900 dark:text-rose-200 text-sm">${t.name}</span>
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(t.audio)}, 'Phân tích bẫy ${tIdx + 1}')" class="touch-target px-3 py-1 rounded-lg bg-rose-200 dark:bg-rose-900/60 text-rose-900 dark:text-rose-100 text-xs font-semibold">
                            🔊 Nghe phân tích bẫy
                          </button>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300"><strong>• Tình huống:</strong> ${t.situation}</p>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300"><strong>• Bản chất khác biệt:</strong> ${t.explanation}</p>

                        <!-- So sánh đúng / sai -->
                        <div class="grid sm:grid-cols-2 gap-2 pt-1">
                          <div class="p-3 rounded-xl bg-rose-100/80 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800 text-xs sm:text-sm">
                            <span class="font-bold text-rose-800 dark:text-rose-300">${t.wrong ? '❌ Sai:' : '↔ Đối chiếu:'}</span>
                            <span class="hanzi-text font-bold text-rose-950 dark:text-rose-100 ml-1">${t.wrong || 'Xem câu đối chiếu'}</span>
                          </div>
                          <div class="p-3 rounded-xl bg-emerald-100/80 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800 text-xs sm:text-sm">
                            <span class="font-bold text-emerald-800 dark:text-emerald-300">✅ Chuẩn:</span>
                            <span class="hanzi-text font-bold text-emerald-950 dark:text-emerald-100 ml-1">${Renderer.highlightWord(t.right, curWord.hanzi)}</span>
                          </div>
                        </div>

                        <!-- Cặp câu đối chiếu ít đổi thành phần nếu có -->
                        ${t.comparisons && t.comparisons.length ? `
                          <div class="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
                            <div class="font-bold text-slate-700 dark:text-slate-300">🔍 Cặp câu đối chiếu ngữ cảnh:</div>
                            ${t.comparisons.map(cp => `
                              <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 dark:border-slate-700/60 pb-1 last:border-0 last:pb-0">
                                <span class="hanzi-text font-bold text-slate-900 dark:text-white">${cp.zh}</span>
                                <span class="text-slate-500">${cp.vi}</span>
                              </div>
                            `).join('')}
                          </div>
                        ` : ''}

                        <p class="text-xs font-bold text-rose-900 dark:text-rose-300">💡 Mẹo chọn nhanh: ${t.tip}</p>

                        <!-- Mini quiz kiểm tra bẫy -->
                        ${t.checkQuestion ? `
                          <div class="pt-3 border-t border-rose-200 dark:border-rose-900/60 space-y-2">
                            <div class="text-xs font-bold uppercase text-rose-800 dark:text-rose-300">${t.checkQuestion.q}</div>
                            <div class="flex flex-wrap gap-2">
                              ${t.checkQuestion.options.map((opt, oIdx) => `
                                <button onclick="Renderer.checkTrapMiniQuiz('${curWord.id}', ${tIdx}, ${oIdx})" class="touch-target px-3.5 py-1.5 rounded-xl border text-xs font-bold hanzi-text bg-white dark:bg-slate-800 hover:bg-slate-50 border-slate-300 dark:border-slate-700">
                                  ${opt}
                                </button>
                              `).join('')}
                            </div>
                            <div id="trap-feedback-${curWord.id}-${tIdx}" class="hidden p-2.5 rounded-xl text-xs font-semibold"></div>
                          </div>
                        ` : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- 5.6 & 5.7 & 5.8: PHÁT ÂM, NHỚ CHỮ & CHỐT DÙNG -->
              <div class="grid sm:grid-cols-3 gap-3">
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                  <div class="flex items-center justify-between">
                    <h5 class="font-bold text-xs text-slate-900 dark:text-white">5.6. Luyện đọc</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.pron.audio)}, 'Luyện đọc')" class="touch-target px-2 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-400">${curWord.pron.guide}</p>
                </div>

                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                  <div class="flex items-center justify-between">
                    <h5 class="font-bold text-xs text-slate-900 dark:text-white">5.7. Nhớ mặt chữ</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.write.audio)}, 'Mẹo nhớ chữ')" class="touch-target px-2 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-400">${curWord.write.desc}</p>
                </div>

                <div class="p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 space-y-2">
                  <div class="flex items-center justify-between">
                    <h5 class="font-bold text-xs text-indigo-950 dark:text-indigo-200">5.8. Chốt cách dùng</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.summaryAudio.length ? curWord.summaryAudio : [{lang:'vi-VN', text: curWord.summary}])}, 'Chốt cách dùng')" class="touch-target px-2 py-0.5 rounded bg-indigo-600 text-white text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-indigo-900 dark:text-indigo-300 font-medium">${curWord.summary}</p>
                </div>
              </div>

              <!-- Ghi chú cá nhân -->
              <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-2">
                <label class="block text-xs font-bold uppercase text-slate-500">📝 Ghi chú cá nhân cho từ này (Tự động lưu):</label>
                <input type="text" oninput="Renderer.onSaveWordNote('${curWord.id}', this.value)" value="${Renderer.escapeHtml(progress.notes[curWord.id] || '')}" placeholder="Ghi lại mẹo của bạn hoặc câu bạn tự nghĩ ra..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>

              <!-- Chuyển từ & Đánh dấu hoàn thành -->
              <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2">
                  ${prevWord ? `
                    <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}', groupId: '${curGroup.id}', wordId: '${prevWord.id}' })" class="touch-target px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-200">
                      ← Từ trước (#${prevWord.index})
                    </button>
                  ` : ''}
                  ${nextWord ? `
                    <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}', groupId: '${curGroup.id}', wordId: '${nextWord.id}' })" class="touch-target px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-200">
                      Từ sau (#${nextWord.index}) →
                    </button>
                  ` : ''}
                </div>

                <button onclick="Renderer.toggleCompleteWord('${curWord.id}')" class="touch-target px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center gap-2 ${isCompleted ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">
                  <span>${isCompleted ? '✓ Đã hoàn thành từ này (Nhấn để hủy)' : 'Đánh dấu đã hiểu từ này ➔'}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      },

      // === C. MÀN HÌNH BÀI TẬP & TỰ DÙNG TỪ ===
      renderExerciseView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const curGroup = AppStore.currentGroup || curLesson.groups[0];
        const progress = Storage.getProgress();

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">${curLesson.level} • ${curLesson.title}</span>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white mt-1">Luyện Tập: ${curGroup.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Làm bài trắc nghiệm kiểm tra phản xạ và thực hành tự đặt câu với 3 tầng trợ giúp.
              </p>
            </div>

            <!-- 1. BÀI TẬP TRẮC NGHIỆM & NGHE HIỂU -->
            <div class="space-y-4">
              <h3 class="text-base font-bold text-slate-900 dark:text-white">1. Bài tập trắc nghiệm & Nghe hiểu (${curGroup.exercises.length} câu)</h3>
              <div class="grid gap-4">
                ${curGroup.exercises.map((ex, exIdx) => {
                  const saved = progress.completedExercises[ex.id];
                  const hasAnswered = saved !== undefined;
                  const isCorrect = hasAnswered && saved.selected === ex.correct;

                  return `
                    <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border ${hasAnswered ? (isCorrect ? 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/20' : 'border-rose-300 dark:border-rose-800 bg-rose-50/20') : 'border-slate-200 dark:border-slate-800'} space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 text-xs font-bold">Câu ${exIdx + 1}: ${ex.type}</span>${ex.questionAudio.length ? `
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.questionAudio)}, 'Đề bài câu ${exIdx + 1}')" class="touch-target px-3 py-1 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">
                            🔊 Nghe đề bài ${ex.isListening ? '(Bài nghe)' : ''}
                          </button>
                        ` : ''}
                      </div>

                      <div class="hanzi-text font-bold text-base text-slate-900 dark:text-white">${ex.prompt}</div>

                      <!-- Options -->
                      <div class="grid sm:grid-cols-2 gap-2 pt-1">
                        ${ex.options.map((opt, oIdx) => `
                          <button onclick="Renderer.submitExerciseOption('${ex.id}', ${oIdx}, ${ex.correct})"
                            class="touch-target p-3 rounded-xl border text-xs sm:text-sm font-semibold hanzi-text text-left transition flex items-center justify-between ${hasAnswered && saved.selected === oIdx ? (isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-rose-600 text-white border-rose-600 shadow') : 'bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200'}">
                            <span>${opt}</span>
                            ${hasAnswered && oIdx === ex.correct ? '<span>✓</span>' : ''}
                          </button>
                        `).join('')}
                      </div>

                      <!-- Transcript & Explanation -->
                      ${hasAnswered ? `
                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2 text-xs sm:text-sm">
                          <div class="font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-700 dark:text-rose-400'}">
                            ${isCorrect ? '✅ ĐÚNG: ' + ex.reasonRight : '⚠️ CẦN SỬA: ' + ex.reasonWrong}
                          </div>
                          ${ex.transcript ? `
                            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hanzi-text text-slate-800 dark:text-slate-200">
                              <strong>📜 Bản chép lời (Transcript):</strong> ${ex.transcript}
                            </div>
                          ` : ''}
                          ${ex.explainAudio.length ? `
                            <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.explainAudio)}, 'Giải thích câu ${exIdx + 1}')" class="touch-target px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold">
                              🔊 Nghe Audio giải thích
                            </button>
                          ` : ''}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 2. TỰ DÙNG TỪ 3 TẦNG TRỢ GIÚP -->
            ${curGroup.selfUse.length > 0 ? `
              <div class="space-y-4">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">2. Luyện tự dùng từ trong câu (3 Tầng trợ giúp)</h3>
                <div class="grid gap-4">
                  ${curGroup.selfUse.map((su, sIdx) => {
                    const draft = progress.selfUseAnswers[su.id] || '';
                    return `
                      <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase">Tình huống ${sIdx + 1}</span>
                          ${su.questionAudio.length ? `
                            <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.questionAudio)}, 'Tình huống tự đặt câu')" class="touch-target px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 text-xs font-semibold">
                              🔊 Nghe tình huống
                            </button>
                          ` : ''}
                        </div>
                        <p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${su.situation}</p>

                        <div>
                          <label class="block text-xs font-semibold text-slate-500 mb-1">Nhập câu tiếng Trung của bạn (Chữ Hán):</label>
                          <input type="text" oninput="Renderer.onSaveSelfUseDraft('${su.id}', this.value)" value="${Renderer.escapeHtml(draft)}" placeholder="Nhập câu tiếng Trung để tự đối chiếu..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hanzi-text text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>

                        <!-- 3 Tầng Progressive Disclosure -->
                        <div class="space-y-2 pt-1">
                          <details class="p-3 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 text-xs">
                            <summary class="font-bold text-indigo-900 dark:text-indigo-200 cursor-pointer">1️⃣ Mở gợi ý 1 (Ý cần nói)</summary>
                            <div class="pt-2 text-slate-700 dark:text-slate-300">
                              <p>${su.hint1}</p>
                              ${su.hint1Audio.length ? `<button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.hint1Audio)}, 'Gợi ý 1')" class="mt-1 text-indigo-600 dark:text-indigo-400 font-semibold underline">🔊 Nghe gợi ý 1</button>` : ''}
                            </div>
                          </details>

                          <details class="p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 text-xs">
                            <summary class="font-bold text-amber-900 dark:text-amber-200 cursor-pointer">2️⃣ Mở gợi ý 2 (Khung câu chữ Hán)</summary>
                            <div class="pt-2 text-slate-700 dark:text-slate-300">
                              <p class="hanzi-text font-bold text-sm text-amber-950 dark:text-amber-100">${su.hint2}</p>
                              ${su.hint2Audio.length ? `<button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.hint2Audio)}, 'Gợi ý 2')" class="mt-1 text-amber-600 dark:text-amber-400 font-semibold underline">🔊 Nghe gợi ý 2</button>` : ''}
                            </div>
                          </details>

                          <details class="p-3 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 text-xs">
                            <summary class="font-bold text-emerald-900 dark:text-emerald-200 cursor-pointer">3️⃣ Mở câu mẫu đối chiếu & Lời giải</summary>
                            <div class="pt-2 space-y-2">
                              <div class="hanzi-text text-base font-bold text-emerald-950 dark:text-emerald-100">✅ Câu mẫu: ${su.modelAnswer}</div>
                              <p class="text-slate-700 dark:text-slate-300">${su.modelExplain}</p>
                              ${su.modelAudio.length ? `
                                <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.modelAudio)}, 'Câu mẫu')" class="touch-target px-3 py-1 rounded-lg bg-emerald-700 text-white font-bold">
                                  🔊 Nghe câu mẫu
                                </button>
                              ` : ''}
                            </div>
                          </details>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      // === D. MÀN HÌNH ÔN TẬP 1-3-7 NGÀY ===
      renderReviewView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const allReviews = curLesson.groups.flatMap(g => g.reviews);

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <span class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider">${curLesson.level} • ${curLesson.title}</span>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white mt-1">🔄 Ôn Tập Ngắt Quãng (Mốc 1 – 3 – 7 Ngày)</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Tự suy nghĩ và trả lời trước, sau đó bấm mở khóa đáp án để đối chiếu và nghe lời giảng.
              </p>
            </div>

            <!-- Mốc 1 - 3 - 7 ngày -->
            <div class="space-y-4">
              ${[1, 3, 7].map(day => {
                const dayReviews = allReviews.filter(r => r.day === day);
                if (dayReviews.length === 0) return '';
                return `
                  <details class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm" ${day === 1 ? 'open' : ''}>
                    <summary class="font-bold text-base text-slate-900 dark:text-white cursor-pointer flex items-center justify-between">
                      <span>Mốc ôn tập Ngày ${day} (${dayReviews.length} câu hỏi)</span>
                      <span class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold">Nhấn để đóng/mở</span>
                    </summary>

                    <div class="grid gap-3 pt-4">
                      ${dayReviews.map((r) => `
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2.5">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-700 dark:text-indigo-300">Dạng: ${r.type}</span>
                            ${r.listenAudio.length ? `
                              <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(r.listenAudio)}, 'Nghe câu hỏi ôn tập')" class="touch-target px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-semibold">
                                🔊 Nghe câu hỏi
                              </button>
                            ` : ''}
                          </div>
                          <div class="hanzi-text font-bold text-sm text-slate-900 dark:text-white">${r.q}</div>

                          <details class="text-xs pt-1">
                            <summary class="touch-target text-indigo-600 dark:text-indigo-400 font-bold cursor-pointer hover:underline">
                              🔓 Xem đáp án chuẩn & Lời giải

      // === ACTION HANDLERS ===
      escapeJsonAttr(obj) {
        return JSON.stringify(obj || []).replace(/"/g, '&quot;');

      onSelectGroup(groupId) {
        if (!AppStore.currentLesson) return;
        const grp = AppStore.currentLesson.groups.find(g => g.id === groupId);
        if (grp) {
          AppStore.currentGroup = grp;
          AppStore.currentWord = grp.words[0] || null;
          this.renderCurrentView();
        }
      },

      playSequentialLecture(wordId) {
        if (!AppStore.currentGroup) return;
        const w = AppStore.currentGroup.words.find(it => it.id === wordId);
        if (!w) return;

        const queue = [];
        queue.push(...w.introAudio);
        queue.push(...w.meaning.audio);
        w.structures.forEach(st => queue.push(...st.audio));
        queue.push({ lang: "vi-VN", text: "Tiếp theo là các câu ví dụ thực tế:" });
        w.examples.forEach(ex => {
          queue.push({ lang: "zh-CN", text: ex.zh, pause: 1200 });
          queue.push({ lang: "vi-VN", text: ex.vi, pause: 600 });
        });
        w.traps.forEach(t => queue.push(...t.audio));
        if (w.summaryAudio && w.summaryAudio.length) {
          queue.push(...w.summaryAudio);
        } else if (w.summary) {
          queue.push({ lang: "vi-VN", text: "Tổng kết cách dùng: " + w.summary });
        }
        queue.push({
          lang: "vi-VN",
          text: "Đã kết thúc bài giảng lý thuyết. Hệ thống tự động dừng lại để bạn luyện tập đặt câu hoặc làm bài kiểm tra."
        });

        TTS.playQueue(queue, `Giảng tuần tự: #${w.index} (${w.hanzi})`);
      },

      checkTrapMiniQuiz(wordId, trapIdx, optionIdx) {
        if (!AppStore.currentGroup) return;
        const w = AppStore.currentGroup.words.find(it => it.id === wordId);
        if (!w || !w.traps[trapIdx] || !w.traps[trapIdx].checkQuestion) return;

        const q = w.traps[trapIdx].checkQuestion;
        const fbEl = document.getElementById(`trap-feedback-${wordId}-${trapIdx}`);
        if (!fbEl) return;

        fbEl.classList.remove('hidden');
        if (optionIdx === q.correct) {
          fbEl.className = "p-2.5 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-900 dark:bg-emerald-950 dark:text-emerald-200";
          fbEl.innerHTML = `🎉 Chính xác! ${q.explain}`;
        } else {
          fbEl.className = "p-2.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200";
          fbEl.innerHTML = `💡 Chưa đúng: ${q.explain}`;
        }
      },

      toggleCompleteWord(wordId) {
        const progress = Storage.getProgress();
        if (progress.completedWords[wordId]) {
          delete progress.completedWords[wordId];
        } else {
          progress.completedWords[wordId] = Date.now();
          if (!progress.reviewsSchedule[wordId]) {
            progress.reviewsSchedule[wordId] = {
              stage: 1,
              dueDate: Date.now() + 1 * 24 * 60 * 60 * 1000,
              history: []
            };
          }
        }
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      toggleBookmark(wordId) {
        const progress = Storage.getProgress();
        progress.bookmarks[wordId] = !progress.bookmarks[wordId];
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      onSaveWordNote(wordId, note) {
        const progress = Storage.getProgress();
        progress.notes[wordId] = note;
        Storage.saveProgress(progress);
      },

      submitExerciseOption(exId, selectedIdx, correctIdx) {
        const progress = Storage.getProgress();
        progress.completedExercises[exId] = {
          selected: selectedIdx,
          isCorrect: selectedIdx === correctIdx,
          timestamp: Date.now()
        };
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      onSaveSelfUseDraft(suId, val) {
        const progress = Storage.getProgress();
        progress.selfUseAnswers[suId] = val;
        Storage.saveProgress(progress);
      },

      onSearchInput(val) {
        AppStore.searchQuery = val;
        this.renderCurrentView();
      },

      onSelectVoice(lang, voiceURI) {
        const s = Storage.getSettings();
        if (lang === 'vi') s.voiceVi = voiceURI;
        if (lang === 'zh') s.voiceZh = voiceURI;
        Storage.saveSettings(s);
      },

      onSetDefaultRate(rate) {
        const s = Storage.getSettings();
        s.rate = rate;
        Storage.saveSettings(s);
        const btn = document.getElementById('btn-audio-rate');
        if (btn) btn.textContent = `${rate}×`;
        this.renderCurrentView();
      },

      setTheme(theme) {
        const s = Storage.getSettings();
        s.theme = theme;
        Storage.saveSettings(s);
        this.applyTheme(theme);
        this.renderCurrentView();
      },

      applyTheme(theme) {
        const root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      },

      setFontSize(sizePx) {
        const s = Storage.getSettings();
        s.fontSize = sizePx;
        Storage.saveSettings(s);
        document.documentElement.style.setProperty('--app-font-size', `${sizePx}px`);
        this.renderCurrentView();
      },

      onImportBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const res = Storage.importBackupJSON(e.target.result);
          if (res.success) {
            alert("Khôi phục tiến trình học thành công!");
            location.reload();
          } else {
            alert("Lỗi nhập tệp: " + res.error);
          }
        };
        reader.readAsText(file);
      },

      confirmReset() {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử học và tiến độ đã lưu không? Thao tác này không thể hoàn tác.")) {
          Storage.resetAll();
          location.reload();
        }
      }
    };

    // 5B. TRÌNH PHÁT NGHE THỤ ĐỘNG (PASSIVE LISTENING ENGINE)
    const PassiveStore = {
      KEY: 'HSK_PASSIVE_CFG_V1',
      defaults: { mode: 2, groups: [], repeat: 2, pause: 1000, order: 'seq', sleep: 'end', wake: true },
      get() {
        try {
          const raw = localStorage.getItem(this.KEY);
          return Object.assign({}, this.defaults, raw ? JSON.parse(raw) : {});
        } catch (e) { return Object.assign({}, this.defaults); }
      },
      save(cfg) { try { localStorage.setItem(this.KEY, JSON.stringify(cfg)); } catch (e) {} }
    };

    const Passive = {
      cfg: null,
      playlist: [],
      pos: 0,
      queue: [],
      qi: 0,
      playing: false,
      paused: false,
      token: 0,
      timer: null,
      watchdog: null,
      sleepTimer: null,
      sleepEndAt: 0,
      wakeLock: null,
      utter: null,
      statusText: '',

      init() {
        this.cfg = PassiveStore.get();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && this.playing) this.acquireWake();
        });
      },

      // ---------- Dữ liệu ----------
      allWords() {
        const out = [];
        AppStore.lessons.forEach(l => l.groups.forEach(g => g.words.forEach(w => out.push({ w, gid: g.id }))));
        return out;
      },
      groupList() {
        const arr = [];
        AppStore.lessons.forEach(l => l.groups.forEach(g => arr.push(g)));
        return arr;
      },
      scopedWords() {
        const all = this.allWords();
        const sel = this.cfg.groups;
        if (!sel || !sel.length) return all;
        const f = all.filter(x => sel.includes(x.gid));
        return f.length ? f : all;
      },
      buildPlaylist() {
        const list = this.scopedWords().slice();
        if (this.cfg.order === 'shuffle') {
          for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
          }
        }
        return list;
      },

      // ---------- Dựng hàng đợi âm thanh cho 1 từ ----------
      buildItems(entry) {
        const w = entry.w, c = this.cfg;
        const rep = Number(c.repeat) || 1, sp = Number(c.pause) || 1000;
        const zh = (text) => Array.from({ length: rep }, () => ({ lang: 'zh-CN', text, pause: sp }));
        const vi = (text, pause = 600) => ({ lang: 'vi-VN', text, pause });
        let q = [];

        if (c.mode === 1) {
          q.push(...zh(w.hanzi), vi(w.coreMeaning, 900));
        } else if (c.mode === 2) {
          q.push(...zh(w.hanzi), vi(w.coreMeaning, 700));
          const brief = w.meaning.keyPoint || w.meaning.situation;
          if (brief) q.push(vi(brief, 900));
          w.examples.forEach(ex => {
            if (ex.zh) q.push(...zh(ex.zh));
            if (ex.vi) q.push(vi(ex.vi, 900));
          });
        } else if (c.mode === 3) {
          q.push(vi(`Từ số ${w.index}.`, 400));
          q.push(...w.introAudio.map(x => ({ ...x })));
          q.push(...w.meaning.audio.map(x => ({ ...x })));
          w.structures.forEach(s => q.push(...s.audio.map(x => ({ ...x }))));
          if (w.examples.length) {
            q.push(vi('Các câu ví dụ thực tế:', 500));
            w.examples.forEach(ex => {
              if (ex.explainAudio.length) q.push(...ex.explainAudio.map(x => ({ ...x })));
              else {
                q.push({ lang: 'zh-CN', text: ex.zh, pause: 1000 });
                q.push(vi(ex.vi, 600));
              }
            });
          }
          w.traps.forEach(t => q.push(...t.audio.map(x => ({ ...x }))));
          if (w.summaryAudio.length) q.push(...w.summaryAudio.map(x => ({ ...x })));
          else if (w.summary) q.push(vi('Tổng kết: ' + w.summary, 800));
        } else {
          q.push(...zh(w.hanzi));
          w.examples.forEach(ex => { if (ex.zh) q.push(...zh(ex.zh)); });
        }

        q = q.filter(it => String(it.text || '').replace(/\[.*?\]/g, '').trim());
        if (q.length) q[q.length - 1].pause = Math.max(q[q.length - 1].pause || 0, 1500);
        return q;
      },

      // ---------- Điều khiển phát ----------
      start(fromWordId) {
        if (!('speechSynthesis' in window)) { this.setState('Thiết bị không hỗ trợ đọc giọng nói.'); return; }
        TTS.stop();
        this.statusText = '';
        this.clearTimers();
        this.token++;
        this.playlist = this.buildPlaylist();
        if (!this.playlist.length) return;
        let idx = 0;
        if (fromWordId) { const f = this.playlist.findIndex(x => x.w.id === fromWordId); if (f >= 0) idx = f; }
        this.pos = idx;
        this.playing = true;
        this.paused = false;
        this.armSleep();
        this.acquireWake();
        this.loadWord();
      },

      loadWord() {
        const entry = this.playlist[this.pos];
        if (!entry) { this.finish('Đã phát hết danh sách.'); return; }
        this.queue = this.buildItems(entry);
        this.qi = 0;
        this.syncUI();
        this.next();
      },

      next() {
        if (!this.playing || this.paused) return;
        if (this.qi >= this.queue.length) { this.advanceWord(); return; }

        const token = this.token;
        const item = this.queue[this.qi];
        const text = String(item.text).replace(/\[.*?\]/g, '').trim();
        const lang = item.lang || 'vi-VN';
        const isZh = lang.startsWith('zh');

        const cap = document.getElementById('ps-caption');
        if (cap) cap.textContent = (isZh ? '🇨🇳 ' : '🇻🇳 ') + text;
        this.updateProgress();

        const u = new SpeechSynthesisUtterance(text);
        this.utter = u;
        u.lang = lang;
        const voice = TTS.findBestVoice(lang);
        if (voice) u.voice = voice;
        const rate = Number(Storage.getSettings().rate) || 1.0;
        u.rate = rate;

        let done = false;
        const step = () => {
          if (done || token !== this.token || !this.playing || this.paused) return;
          done = true;
          clearTimeout(this.watchdog);
          const p = typeof item.pause === 'number' ? Math.max(0, item.pause) : 350;
          this.timer = setTimeout(() => {
            if (token !== this.token) return;
            this.qi++;
            this.next();
          }, p);
        };
        u.onend = step;
        u.onerror = (e) => {
          if (e.error === 'canceled' || e.error === 'interrupted') return;
          console.warn('Passive TTS error:', e.error);
          step();
        };

        // Chốt chặn: một số trình duyệt đôi khi không bắn sự kiện onend
        clearTimeout(this.watchdog);
        this.watchdog = setTimeout(step, Math.max(6000, (text.length * (isZh ? 700 : 280)) / rate + 3000));

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      },

      advanceWord() {
        this.pos++;
        if (this.pos >= this.playlist.length) {
          if (this.cfg.order === 'loop') this.pos = 0;
          else { this.finish('Đã phát hết danh sách.'); return; }
        }
        this.loadWord();
      },

      toggle() {
        if (!this.playing) { this.start(); return; }
        if (this.paused) {
          this.paused = false;
          this.acquireWake();
          this.syncUI();
          this.next();
        } else {
          this.paused = true;
          this.token++;
          this.clearTimers(true);
          window.speechSynthesis.cancel();
          this.syncUI();
        }
      },

      skip(delta) {
        if (!this.playing) { this.start(); if (!this.playing) return; }
        let p = this.pos + delta;
        if (p < 0) p = 0;
        if (p >= this.playlist.length) {
          if (this.cfg.order === 'loop') p = 0;
          else { this.finish('Đã phát hết danh sách.'); return; }
        }
        this.token++;
        this.clearTimers(true);
        window.speechSynthesis.cancel();
        this.pos = p;
        this.paused = false;
        this.playing = true;
        this.loadWord();
      },

      jump(wordId) { this.start(wordId); },

      // Dừng hẳn (người dùng bấm nút Dừng)
      stopAll() {
        this.halt(true);
        this.pos = 0;
        this.setState('Đã dừng');
        this.resetDisplay();
      },

      // Dừng nội bộ (đổi tab, hết giờ, hết danh sách)
      halt(silent) {
        const was = this.playing;
        this.token++;
        this.clearTimers();
        this.playing = false;
        this.paused = false;
        this.sleepEndAt = 0;
        this.releaseWake();
        if (was && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        if (!silent) this.syncUI();
      },

      finish(msg) {
        this.halt(true);
        this.setState(msg);
        this.syncUI();
      },

      clearTimers(keepSleep) {
        clearTimeout(this.timer);
        clearTimeout(this.watchdog);
        if (!keepSleep && this.sleepTimer) { clearInterval(this.sleepTimer); this.sleepTimer = null; }
      },

      // ---------- Cấu hình ----------
      setCfg(key, val) {
        this.cfg[key] = val;
        PassiveStore.save(this.cfg);
        if (this.playing && (key === 'order')) {
          // đổi thứ tự phát: dựng lại danh sách từ từ hiện tại
          const cur = this.playlist[this.pos];
          this.start(cur ? cur.w.id : undefined);
        }
        if (key === 'sleep' && this.playing) this.armSleep();
        Renderer.renderCurrentView();
        this.syncUI();
      },
      selectAllGroups() {
        this.cfg.groups = [];
        PassiveStore.save(this.cfg);
        this.afterScopeChange();
      },
      toggleGroup(gid) {
        const all = this.allWords();
        const allIds = [...new Set(all.map(x => x.gid))];
        let sel = (this.cfg.groups && this.cfg.groups.length) ? this.cfg.groups.slice() : [];
        const wasAll = sel.length === 0;
        if (wasAll) sel = [gid];
        else if (sel.includes(gid)) sel = sel.filter(x => x !== gid);
        else sel.push(gid);
        if (sel.length === 0 || sel.length === allIds.length) sel = [];
        this.cfg.groups = sel;
        PassiveStore.save(this.cfg);
        this.afterScopeChange();
      },
      afterScopeChange() {
        if (this.playing) this.start();
        Renderer.renderCurrentView();
        this.syncUI();
      },
      setRate(r) {
        const s = Storage.getSettings();
        s.rate = r;
        Storage.saveSettings(s);
        Renderer.renderCurrentView();
        this.syncUI();
      },

      // ---------- Hẹn giờ & giữ sáng màn hình ----------
      armSleep() {
        if (this.sleepTimer) { clearInterval(this.sleepTimer); this.sleepTimer = null; }
        const m = this.cfg.sleep;
        if (typeof m !== 'number') { this.sleepEndAt = 0; this.updateSleepPill(); return; }
        this.sleepEndAt = Date.now() + m * 60000;
        this.sleepTimer = setInterval(() => {
          if (Date.now() >= this.sleepEndAt) {
            this.finish('Đã hết giờ hẹn · tự động dừng.');
            return;
          }
          this.updateSleepPill();
        }, 1000);
        this.updateSleepPill();
      },
      updateSleepPill() {
        const pill = document.getElementById('ps-sleep-pill');
        const left = document.getElementById('ps-sleep-left');
        if (!pill || !left) return;
        if (!this.playing || !this.sleepEndAt) { pill.classList.add('hidden'); return; }
        const s = Math.max(0, Math.round((this.sleepEndAt - Date.now()) / 1000));
        left.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        pill.classList.remove('hidden');
      },
      async acquireWake() {
        try {
          if (this.cfg.wake && 'wakeLock' in navigator && !this.wakeLock) {
            this.wakeLock = await navigator.wakeLock.request('screen');
            this.wakeLock.addEventListener('release', () => { this.wakeLock = null; });
          }
        } catch (e) { /* bỏ qua */ }
      },
      releaseWake() {
        try { if (this.wakeLock) this.wakeLock.release(); } catch (e) {}
        this.wakeLock = null;
      },

      // ---------- Cập nhật giao diện ----------
      setState(msg) { this.statusText = msg || ''; },

      resetDisplay() {
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        set('ps-hanzi', '🎧'); set('ps-pinyin', '');
        set('ps-meaning', `Nhấn ▶ để bắt đầu · ${this.scopedWords().length} từ`);
        set('ps-caption', 'Lời đang đọc sẽ hiện ở đây');
        const bar = document.getElementById('ps-progress'); if (bar) bar.style.width = '0%';
        this.syncUI();
      },

      updateProgress() {
        const bar = document.getElementById('ps-progress');
        if (!bar || !this.playlist.length) return;
        const frac = (this.pos + (this.queue.length ? this.qi / this.queue.length : 0)) / this.playlist.length;
        bar.style.width = Math.min(100, Math.round(frac * 100)) + '%';
      },

      syncUI() {
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        const entry = this.playing ? this.playlist[this.pos] : null;

        let state = 'Sẵn sàng';
        if (this.playing && this.paused) state = 'Tạm dừng';
        else if (this.playing) state = 'Đang phát';
        else if (this.statusText) state = this.statusText;
        set('ps-state', state);
        set('ps-playpause', this.playing && !this.paused ? '⏸' : '▶');

        const eq = document.getElementById('ps-eq');
        if (eq) eq.classList.toggle('on', this.playing && !this.paused);

        if (entry) {
          set('ps-hanzi', entry.w.hanzi);
          set('ps-pinyin', entry.w.pinyin);
          set('ps-meaning', entry.w.coreMeaning);
          set('ps-counter', `${this.pos + 1} / ${this.playlist.length}`);
        } else {
          set('ps-counter', `0 / ${this.scopedWords().length}`);
        }

        document.querySelectorAll('.ps-word').forEach(el => el.classList.remove('cur'));
        if (entry) {
          const el = document.getElementById(`ps-w-${entry.w.id}`);
          if (el) el.classList.add('cur');
        }
        this.updateProgress();
        this.updateSleepPill();
      }
    };

    // 6. KHỞI TẠO ỨNG DỤNG (APP BOOTSTRAP)
    function initializeApp() {
      TTS.init();
      Passive.init();

      const settings = Storage.getSettings();
      Renderer.applyTheme(settings.theme);
      document.documentElement.style.setProperty('--app-font-size', `${settings.fontSize || '16'}px`);

      const rawLessons = DataNormalizer.findRawLessons();
      if (rawLessons && Array.isArray(rawLessons) && rawLessons.length > 0) {
        AppStore.lessons = rawLessons.map((l, idx) => DataNormalizer.normalizeLesson(l, idx)).filter(Boolean);
      }

      if (AppStore.lessons.length > 0) {
        const progress = Storage.getProgress();
        let targetLesson = AppStore.lessons.find(l => l.id === progress.lastLessonId) || AppStore.lessons[0];
        AppStore.currentLesson = targetLesson;

        let targetGroup = targetLesson.groups.find(g => g.id === progress.lastGroupId) || targetLesson.groups[0];
        AppStore.currentGroup = targetGroup;

        if (targetGroup) {
          AppStore.currentWord = targetGroup.words.find(w => w.id === progress.lastWordId) || targetGroup.words[0];
        }

        const topInd = document.getElementById('top-lesson-indicator');
        if (topInd) topInd.textContent = `${targetLesson.level} • ${targetLesson.title}`;
      }

      Router.navigate('home');
    }

    window.addEventListener('DOMContentLoaded', initializeApp);
  </script>
