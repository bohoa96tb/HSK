  <!-- ================= APPLICATION ENGINE SCRIPT ================= -->
  <script>
    /**
     * HSK AUDIO LEARNING WEB APP - CLIENT CORE ENGINE
     * Thiết kế thuần Vanilla JS, tối ưu hoàn toàn cho hợp đồng dữ liệu lesson_HSK1.js
     */

    // 1. CẤU HÌNH & HỆ THỐNG LƯU TRỮ (STORAGE)
    const APP_CONFIG = {
      STORAGE_KEY: 'HSK_STUDIO_PROGRESS_V3',
      SETTINGS_KEY: 'HSK_STUDIO_SETTINGS_V3',
      VERSION: 3.0
    };

    const Storage = {
      getSettings() {
        try {
          const raw = localStorage.getItem(APP_CONFIG.SETTINGS_KEY);
          return raw ? JSON.parse(raw) : {
            theme: 'system',
            fontSize: '16',
            rate: 1.0,
            voiceVi: '',
            voiceZh: '',
            autoAdvance: true
          };
        } catch (e) {
          return { theme: 'system', fontSize: '16', rate: 1.0, voiceVi: '', voiceZh: '', autoAdvance: true };
        }
      },
      saveSettings(settings) {
        try {
          localStorage.setItem(APP_CONFIG.SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) { console.error('Lỗi lưu cấu hình:', e); }
      },
      getProgress() {
        try {
          const raw = localStorage.getItem(APP_CONFIG.STORAGE_KEY);
          return raw ? JSON.parse(raw) : {
            version: APP_CONFIG.VERSION,
            completedWords: {},
            completedExercises: {},
            selfUseAnswers: {},
            notes: {},
            bookmarks: {},
            reviewsSchedule: {},
            lastLessonId: null,
            lastGroupId: null,
            lastWordId: null
          };
        } catch (e) {
          return { version: APP_CONFIG.VERSION, completedWords: {}, completedExercises: {}, selfUseAnswers: {}, notes: {}, bookmarks: {}, reviewsSchedule: {} };
        }
      },
      saveProgress(data) {
        try {
          localStorage.setItem(APP_CONFIG.STORAGE_KEY, JSON.stringify(data));
        } catch (e) { console.error('Lỗi lưu tiến độ:', e); }
      },
      exportBackupJSON() {
        const payload = {
          version: APP_CONFIG.VERSION,
          exportedAt: new Date().toISOString(),
          settings: this.getSettings(),
          progress: this.getProgress()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HSK_TienDoHocTap_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      },
      importBackupJSON(jsonString) {
        try {
          const parsed = JSON.parse(jsonString);
          if (!parsed.progress) throw new Error("Tệp không đúng định dạng sao lưu hợp lệ.");
          this.saveProgress(parsed.progress);
          if (parsed.settings) this.saveSettings(parsed.settings);
          return { success: true };
        } catch (err) {
          return { success: false, error: err.message };
        }
      },
      resetAll() {
        localStorage.removeItem(APP_CONFIG.STORAGE_KEY);
      }
    };

    // 2. CHUẨN HÓA DỮ LIỆU HỌC LIỆU (DATA NORMALIZER)
    const DataNormalizer = {
      findRawLessons() {
        if (typeof ALL_LESSONS !== 'undefined' && Array.isArray(ALL_LESSONS)) return ALL_LESSONS;
        if (typeof window.ALL_LESSONS !== 'undefined' && Array.isArray(window.ALL_LESSONS)) return window.ALL_LESSONS;
        if (typeof LESSONS_HSK1 !== 'undefined' && Array.isArray(LESSONS_HSK1)) return LESSONS_HSK1;
        if (typeof window.LESSONS_HSK1 !== 'undefined' && Array.isArray(window.LESSONS_HSK1)) return window.LESSONS_HSK1;
        return null;
      },

      normalizeLesson(rawLesson, index) {
        if (!rawLesson) return null;
        const lessonId = String(rawLesson.id || `lesson_${index + 1}`);
        const title = rawLesson.title || `Bài học ${index + 1}`;
        const level = (rawLesson.level || "HSK1").toUpperCase();

        const groups = (rawLesson.groups || []).map((grp, gIdx) => {
          const groupId = String(grp.id || `${lessonId}_g${gIdx + 1}`);
          const gTitle = grp.title || `Nhóm ${gIdx + 1}`;
          const gDesc = grp.desc || '';

          // Chuẩn hóa danh sách từ vựng
          const words = (grp.words || []).map((w, wIdx) => {
            const wordId = String(w.id || `${groupId}_w${wIdx + 1}`);
            const hanzi = w.hanzi || '';
            const pinyin = w.pinyin || '';
            const coreMeaning = w.coreMeaning || 'Chưa có giải nghĩa chính';

            // Intro audio
            const introAudio = Array.isArray(w.introAudio) ? w.introAudio : [
              { lang: "zh-CN", text: hanzi, pause: 400 },
              { lang: "vi-VN", text: coreMeaning, pause: 300 }
            ];

            // 5.2 Hiểu nghĩa
            const meaning = {
              situation: (w.meaning && w.meaning.situation) || 'Dùng trong giao tiếp thường nhật.',
              detail: (w.meaning && w.meaning.detail) || '',
              keyPoint: (w.meaning && w.meaning.keyPoint) || coreMeaning,
              audio: (w.meaning && Array.isArray(w.meaning.audio)) ? w.meaning.audio : []
            };

            // 5.3 Cấu trúc / Khung câu
            const structures = Array.isArray(w.structures) ? w.structures.map(st => ({
              title: st.title || 'Cách dùng cơ bản',
              pattern: st.pattern || hanzi,
              note: st.note || '',
              audio: Array.isArray(st.audio) ? st.audio : []
            })) : [];

            // 5.4 Ví dụ thực tế
            const examples = Array.isArray(w.examples) ? w.examples.map(ex => ({
              zh: ex.zh || '',
              vi: ex.vi || '',
              situation: ex.situation || '',
              analysis: ex.analysis || '',
              explainAudio: Array.isArray(ex.explainAudio) ? ex.explainAudio : []
            })) : [];

            // 5.5 Bẫy ngữ pháp (Hỗ trợ cả traps mảng và trap đơn)
            const trapsList = [];
            if (Array.isArray(w.traps)) {
              trapsList.push(...w.traps);
            } else if (w.trap && typeof w.trap === 'object') {
              trapsList.push(w.trap);
            }

            const uniqueTraps = [];
            const seenTrapNames = new Set();
            trapsList.forEach(t => {
              const name = t.name || 'Bẫy thường gặp';
              if (!seenTrapNames.has(name)) {
                seenTrapNames.add(name);
                uniqueTraps.push({
                  name: name,
                  situation: t.situation || '',
                  explanation: t.explanation || '',
                  wrong: t.wrong || '',
                  right: t.right || '',
                  tip: t.tip || '',
                  boundary: t.boundary || '',
                  comparisons: Array.isArray(t.comparisons) ? t.comparisons : [],
                  checkQuestion: t.checkQuestion && typeof t.checkQuestion === 'object' ? {
                    q: t.checkQuestion.q || '',
                    options: Array.isArray(t.checkQuestion.options) ? t.checkQuestion.options : [],
                    correct: typeof t.checkQuestion.correct === 'number' ? t.checkQuestion.correct : 0,
                    explain: t.checkQuestion.explain || ''
                  } : null,
                  audio: Array.isArray(t.audio) ? t.audio : []
                });
              }
            });

            // 5.6 Phát âm & 5.7 Mặt chữ & 5.8 Chốt dùng
            const pron = {
              guide: (w.pron && w.pron.guide) || 'Luyện đọc tròn vành rõ thanh điệu.',
              audio: (w.pron && Array.isArray(w.pron.audio)) ? w.pron.audio : []
            };
            const write = {
              desc: (w.write && w.write.desc) || 'Quan sát nét bút và cấu tạo bộ thủ.',
              audio: (w.write && Array.isArray(w.write.audio)) ? w.write.audio : []
            };
            const summary = typeof w.summary === 'string' ? w.summary : 'Nắm vững bản chất và bối cảnh sử dụng của từ.';
            const summaryAudio = Array.isArray(w.summaryAudio) ? w.summaryAudio : [];

            return {
              id: wordId,
              index: w.index || wIdx + 1,
              hanzi,
              pinyin,
              coreMeaning,
              introAudio,
              meaning,
              structures,
              examples,
              traps: uniqueTraps,
              pron,
              write,
              summary,
              summaryAudio
            };
          });

          // Chuẩn hóa bài tập trắc nghiệm & nghe hiểu
          const exercises = Array.isArray(grp.exercises) ? grp.exercises.map((ex, exIdx) => ({
            id: String(ex.id || `${groupId}_ex${exIdx + 1}`),
            type: ex.type || 'Trắc nghiệm',
            prompt: ex.prompt || ex.q || 'Chọn đáp án đúng nhất:',
            options: Array.isArray(ex.options) ? ex.options : [],
            correct: typeof ex.correct === 'number' ? ex.correct : 0,
            reasonRight: ex.reasonRight || 'Chính xác theo quy tắc ngữ pháp.',
            reasonWrong: ex.reasonWrong || 'Chưa đúng, hãy xem lại bản chất của từ.',
            transcript: ex.transcript || '',
            isListening: Boolean(ex.isListening || ex.listenAudio),
            questionAudio: Array.isArray(ex.questionAudio) ? ex.questionAudio : (Array.isArray(ex.listenAudio) ? ex.listenAudio : []),
            explainAudio: Array.isArray(ex.explainAudio) ? ex.explainAudio : []
          })) : [];

          // Chuẩn hóa phần Tự Dùng Từ (3 Tầng gợi ý)
          const rawSelfList = [];
          if (Array.isArray(grp.selfUse)) rawSelfList.push(...grp.selfUse);
          else if (grp.selfUse && typeof grp.selfUse === 'object') rawSelfList.push(grp.selfUse);

          const selfUse = rawSelfList.map((s, sIdx) => ({
            id: String(s.id || `${groupId}_su${sIdx + 1}`),
            situation: s.situation || 'Tự đặt câu dựa theo ngữ cảnh bài học:',
            hint1: s.hint1 || 'Xác định ý định giao tiếp chính.',
            hint2: s.hint2 || 'Sử dụng cấu trúc vừa học.',
            modelAnswer: s.modelAnswer || '',
            modelExplain: s.modelExplain || '',
            questionAudio: Array.isArray(s.questionAudio) ? s.questionAudio : [],
            hint1Audio: Array.isArray(s.hint1Audio) ? s.hint1Audio : [],
            hint2Audio: Array.isArray(s.hint2Audio) ? s.hint2Audio : [],
            modelAudio: Array.isArray(s.modelAudio) ? s.modelAudio : []
          }));

          // Chuẩn hóa câu hỏi ôn tập ngắt quãng 1-3-7 ngày
          const reviews = Array.isArray(grp.reviews) ? grp.reviews.map((r, rIdx) => ({
            id: String(r.id || `${groupId}_rev${rIdx + 1}`),
            day: r.day || 1,
            type: r.type || 'Nhớ nghĩa & phản xạ',
            q: r.q || r.prompt || '',
            answer: r.answer || '',
            explain: r.explain || '',
            listenAudio: Array.isArray(r.listenAudio) ? r.listenAudio : [],
            audio: Array.isArray(r.audio) ? r.audio : []
          })) : [];

          return {
            id: groupId,
            title: gTitle,
            desc: gDesc,
            words,
            exercises,
            selfUse,
            reviews
          };
        });

        return {
          id: lessonId,
          title,
          level,
          groups
        };
      }
    };

    // 3. BỘ ĐIỀU PHỐI ÂM THANH DUAL-LANGUAGE TTS ENGINE
    const TTS = {
      queue: [],
      currentIndex: 0,
      isPlaying: false,
      isPaused: false,
      token: 0,
      timer: null,
      currentUtterance: null,
      rates: [0.75, 0.9, 1.0, 1.15, 1.25],

      init() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => this.getVoices();
        }
      },

      getVoices() {
        if (!('speechSynthesis' in window)) return [];
        return window.speechSynthesis.getVoices() || [];
      },

      findBestVoice(langCode) {
        const voices = this.getVoices();
        const settings = Storage.getSettings();

        if (langCode.startsWith('vi') && settings.voiceVi) {
          const match = voices.find(v => v.voiceURI === settings.voiceVi);
          if (match) return match;
        }
        if (langCode.startsWith('zh') && settings.voiceZh) {
          const match = voices.find(v => v.voiceURI === settings.voiceZh);
          if (match) return match;
        }

        const exact = voices.find(v => v.lang.replace('_', '-').toLowerCase() === langCode.toLowerCase());
        if (exact) return exact;
        return voices.find(v => v.lang.toLowerCase().startsWith(langCode.slice(0, 2).toLowerCase())) || null;
      },

      playQueue(items, title = "Đang giảng bài...") {
        this.stop();
        if (!items || !items.length) return;
        if (!('speechSynthesis' in window)) {
          this.setUIStatus("Thiết bị không hỗ trợ Web Speech API.", false);
          return;
        }

        this.queue = items.map(it => ({ ...it }));
        this.currentIndex = 0;
        this.isPlaying = true;
        this.isPaused = false;
        this.token++;

        this.setDockVisible(true);
        this.setUIStatus(title, true);
        this.processNext();
      },

      processNext() {
        if (!this.isPlaying || this.isPaused) return;

        if (this.currentIndex >= this.queue.length) {
          this.isPlaying = false;
          this.setUIStatus("Đã phát xong lời giảng.", false);
          this.updateLED('stopped');
          return;
        }

        const localToken = this.token;
        const item = this.queue[this.currentIndex];
        const cleanText = String(item.text || '').replace(/\[.*?\]/g, '').trim();

        if (!cleanText) {
          this.currentIndex++;
          this.processNext();
          return;
        }

        const lang = item.lang || 'vi-VN';
        const langLabel = lang.startsWith('zh') ? '🇨🇳 Tiếng Trung' : '🇻🇳 Tiếng Việt';
        const captionBar = document.getElementById('audio-caption-bar');
        if (captionBar) captionBar.textContent = `[${langLabel}] ${cleanText}`;

        const utter = new SpeechSynthesisUtterance(cleanText);
        this.currentUtterance = utter;
        utter.lang = lang;

        const voice = this.findBestVoice(lang);
        if (voice) utter.voice = voice;

        const settings = Storage.getSettings();
        utter.rate = Number(settings.rate) || 1.0;

        const stepToNext = () => {
          if (localToken !== this.token || !this.isPlaying || this.isPaused) return;
          const pauseMs = typeof item.pause === 'number' ? Math.max(0, item.pause) : 350;
          this.timer = setTimeout(() => {
            if (localToken !== this.token) return;
            this.currentIndex++;
            this.processNext();
          }, pauseMs);
        };

        utter.onend = stepToNext;
        utter.onerror = (e) => {
          if (e.error === 'canceled' || e.error === 'interrupted') return;
          console.warn("TTS Error:", e.error);
          stepToNext();
        };

        this.updateLED('playing');
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      },

      togglePause() {
        if (!this.isPlaying) return;
        if (this.isPaused) {
          this.isPaused = false;
          window.speechSynthesis.resume();
          this.updateLED('playing');
          const lbl = document.getElementById('label-audio-playpause');
          if (lbl) lbl.textContent = "⏸ Tạm dừng";
          this.processNext();
        } else {
          this.isPaused = true;
          this.token++;
          clearTimeout(this.timer);
          window.speechSynthesis.cancel();
          this.updateLED('paused');
          const lbl = document.getElementById('label-audio-playpause');
          if (lbl) lbl.textContent = "▶ Tiếp tục";
        }
      },

      replay() {
        if (this.queue.length > 0) {
          this.playQueue(this.queue, "Phát lại đoạn giảng...");
        }
      },

      stop() {
        this.token++;
        clearTimeout(this.timer);
        this.isPlaying = false;
        this.isPaused = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        this.updateLED('stopped');
        this.setUIStatus("Đã dừng âm thanh.", false);
        const lbl = document.getElementById('label-audio-playpause');
        if (lbl) lbl.textContent = "▶ Phát";
      },

      cycleRate() {
        const settings = Storage.getSettings();
        let curRate = Number(settings.rate) || 1.0;
        let nextIdx = (this.rates.indexOf(curRate) + 1) % this.rates.length;
        if (nextIdx < 0) nextIdx = 2;
        const newRate = this.rates[nextIdx];
        settings.rate = newRate;
        Storage.saveSettings(settings);
        const btn = document.getElementById('btn-audio-rate');
        if (btn) btn.textContent = `${newRate}×`;
      },

      setDockVisible(visible) {
        const dock = document.getElementById('audio-dock');
        if (!dock) return;
        if (visible) dock.classList.remove('translate-y-24', 'opacity-0');
        else dock.classList.add('translate-y-24', 'opacity-0');
      },

      setUIStatus(title, isPlaying) {
        const tEl = document.getElementById('audio-title-bar');
        if (tEl) tEl.textContent = title;
      },

      updateLED(state) {
        const led = document.getElementById('audio-status-led');
        if (!led) return;
        if (state === 'playing') led.className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping shrink-0";
        else if (state === 'paused') led.className = "w-3 h-3 rounded-full bg-amber-400 shrink-0";
        else led.className = "w-3 h-3 rounded-full bg-slate-500 shrink-0";
      }
    };

    // 4. BỘ ĐIỀU HƯỚNG & QUẢN LÝ DỮ LIỆU (ROUTER & STORE)
    const AppStore = {
      lessons: [],
      currentLesson: null,

    const Router = {

    // 5. BỘ TRÌNH DIỄN GIAO DIỆN (VIEW RENDERER)
    const Renderer = {
      escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      },

      highlightWord(sentence, target) {
        if (!sentence || !target) return this.escapeHtml(sentence);
        const safe = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`(${safe})`, 'g');
        return this.escapeHtml(sentence).replace(re, `<span class="target-word-hl">$1</span>`);

      renderCurrentView() {

                          </div>
                          <div class="p-3 rounded-xl bg-emerald-100/80 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800 text-xs sm:text-sm">
                            <span class="font-bold text-emerald-800 dark:text-emerald-300">✅ Chuẩn:</span>
                            <span class="hanzi-text font-bold text-emerald-950 dark:text-emerald-100 ml-1">${Renderer.highlightWord(t.right, curWord.hanzi)}</span>

                        <!-- Mini quiz kiểm tra bẫy -->
                        ${t.checkQuestion ? `
                          <div class="pt-3 border-t border-rose-200 dark:border-rose-900/60 space-y-2">
                            <div class="text-xs font-bold uppercase text-rose-800 dark:text-rose-300">${t.checkQuestion.q}</div>
                            <div class="flex flex-wrap gap-2">

                </div>

                    <h5 class="font-bold text-xs text-slate-900 dark:text-white">5.7. Nhớ mặt chữ</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.write.audio)}, 'Mẹo nhớ chữ')" class="touch-target px-2 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-400">${curWord.write.desc}</p>

                <div class="p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 space-y-2">

                  ` : ''}
                  ${nextWord ? `

      // === C. MÀN HÌNH BÀI TẬP & TỰ DÙNG TỪ ===
      renderExerciseView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const curGroup = AppStore.currentGroup || curLesson.groups[0];
        const progress = Storage.getProgress();

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">${curLesson.level} • ${curLesson.title}</span>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white mt-1">Luyện Tập: ${curGroup.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Làm bài trắc nghiệm kiểm tra phản xạ và thực hành tự đặt câu với 3 tầng trợ giúp.
              </p>
            </div>

            <!-- 1. BÀI TẬP TRẮC NGHIỆM & NGHE HIỂU -->
            <div class="space-y-4">
              <h3 class="text-base font-bold text-slate-900 dark:text-white">1. Bài tập trắc nghiệm & Nghe hiểu (${curGroup.exercises.length} câu)</h3>
              <div class="grid gap-4">
                ${curGroup.exercises.map((ex, exIdx) => {
                  const saved = progress.completedExercises[ex.id];
                  const hasAnswered = saved !== undefined;
                  const isCorrect = hasAnswered && saved.selected === ex.correct;

                  return `
                    <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border ${hasAnswered ? (isCorrect ? 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/20' : 'border-rose-300 dark:border-rose-800 bg-rose-50/20') : 'border-slate-200 dark:border-slate-800'} space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 text-xs font-bold">Câu ${exIdx + 1}: ${ex.type}</span>${ex.questionAudio.length ? `
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.questionAudio)}, 'Đề bài câu ${exIdx + 1}')" class="touch-target px-3 py-1 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">
                            🔊 Nghe đề bài ${ex.isListening ? '(Bài nghe)' : ''}
                          </button>
                        ` : ''}
                      </div>

                      <div class="hanzi-text font-bold text-base text-slate-900 dark:text-white">${ex.prompt}</div>

                      <!-- Options -->
                      <div class="grid sm:grid-cols-2 gap-2 pt-1">
                        ${ex.options.map((opt, oIdx) => `
                          <button onclick="Renderer.submitExerciseOption('${ex.id}', ${oIdx}, ${ex.correct})"
                            class="touch-target p-3 rounded-xl border text-xs sm:text-sm font-semibold hanzi-text text-left transition flex items-center justify-between ${hasAnswered && saved.selected === oIdx ? (isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-rose-600 text-white border-rose-600 shadow') : 'bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200'}">
                            <span>${opt}</span>
                            ${hasAnswered && oIdx === ex.correct ? '<span>✓</span>' : ''}
                          </button>
                        `).join('')}
                      </div>

                      <!-- Transcript & Explanation -->
                      ${hasAnswered ? `
                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2 text-xs sm:text-sm">
                          <div class="font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-700 dark:text-rose-400'}">
                            ${isCorrect ? '✅ ĐÚNG: ' + ex.reasonRight : '⚠️ CẦN SỬA: ' + ex.reasonWrong}
                          </div>
                          ${ex.transcript ? `
                            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hanzi-text text-slate-800 dark:text-slate-200">
                              <strong>📜 Bản chép lời (Transcript):</strong> ${ex.transcript}
                            </div>
                          ` : ''}
                          ${ex.explainAudio.length ? `
                            <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.explainAudio)}, 'Giải thích câu ${exIdx + 1}')" class="touch-target px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold">

            <!-- 2. TỰ DÙNG TỪ 3 TẦNG TRỢ GIÚP -->
            ${curGroup.selfUse.length > 0 ? `
              <div class="space-y-4">

                  ${curGroup.selfUse.map((su, sIdx) => {
                    const draft = progress.selfUseAnswers[su.id] || '';

                      <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase">Tình huống ${sIdx + 1}</span>
                          ${su.questionAudio.length ? `
                            <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.questionAudio)}, 'Tình huống tự đặt câu')" class="touch-target px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 text-xs font-semibold">
                              🔊 Nghe tình huống

                        <!-- 3 Tầng Progressive Disclosure -->
                        <div class="space-y-2 pt-1">

                            <summary class="font-bold text-indigo-900 dark:text-indigo-200 cursor-pointer">1️⃣ Mở gợi ý 1 (Ý cần nói)</summary>

                              ${su.hint1Audio.length ? `<button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.hint1Audio)}, 'Gợi ý 1')" class="mt-1 text-indigo-600 dark:text-indigo-400 font-semibold underline">🔊 Nghe gợi ý 1</button>` : ''}
                            </div>
                          </details>

                          <details class="p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 text-xs">
                            <summary class="font-bold text-amber-900 dark:text-amber-200 cursor-pointer">2️⃣ Mở gợi ý 2 (Khung câu chữ Hán)</summary>
                            <div class="pt-2 text-slate-700 dark:text-slate-300">
                              <p class="hanzi-text font-bold text-sm text-amber-950 dark:text-amber-100">${su.hint2}</p>
                              ${su.hint2Audio.length ? `<button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.hint2Audio)}, 'Gợi ý 2')" class="mt-1 text-amber-600 dark:text-amber-400 font-semibold underline">🔊 Nghe gợi ý 2</button>` : ''}
                            </div>
                          </details>

                          <details class="p-3 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 text-xs">
                            <summary class="font-bold text-emerald-900 dark:text-emerald-200 cursor-pointer">3️⃣ Mở câu mẫu đối chiếu & Lời giải</summary>
                            <div class="pt-2 space-y-2">
                              <div class="hanzi-text text-base font-bold text-emerald-950 dark:text-emerald-100">✅ Câu mẫu: ${su.modelAnswer}</div>
                              <p class="text-slate-700 dark:text-slate-300">${su.modelExplain}</p>
                              ${su.modelAudio.length ? `
                                <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.modelAudio)}, 'Câu mẫu')" class="touch-target px-3 py-1 rounded-lg bg-emerald-700 text-white font-bold">
                                  🔊 Nghe câu mẫu
                                </button>
                              ` : ''}
                            </div>
                          </details>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      // === D. MÀN HÌNH ÔN TẬP 1-3-7 NGÀY ===
      renderReviewView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const allReviews = curLesson.groups.flatMap(g => g.reviews);

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <span class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider">${curLesson.level} • ${curLesson.title}</span>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white mt-1">🔄 Ôn Tập Ngắt Quãng (Mốc 1 – 3 – 7 Ngày)</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Tự suy nghĩ và trả lời trước, sau đó bấm mở khóa đáp án để đối chiếu và nghe lời giảng.
              </p>
            </div>

            <!-- Mốc 1 - 3 - 7 ngày -->
            <div class="space-y-4">
              ${[1, 3, 7].map(day => {
                const dayReviews = allReviews.filter(r => r.day === day);
                if (dayReviews.length === 0) return '';
                return `
                  <details class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm" ${day === 1 ? 'open' : ''}>
                    <summary class="font-bold text-base text-slate-900 dark:text-white cursor-pointer flex items-center justify-between">
                      <span>Mốc ôn tập Ngày ${day} (${dayReviews.length} câu hỏi)</span>
                      <span class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold">Nhấn để đóng/mở</span>
                    </summary>

                    <div class="grid gap-3 pt-4">
                      ${dayReviews.map((r) => `
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2.5">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-700 dark:text-indigo-300">Dạng: ${r.type}</span>
                            ${r.listenAudio.length ? `
                              <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(r.listenAudio)}, 'Nghe câu hỏi ôn tập')" class="touch-target px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-semibold">
                                🔊 Nghe câu hỏi
                              </button>
                            ` : ''}
                          </div>
                          <div class="hanzi-text font-bold text-sm text-slate-900 dark:text-white">${r.q}</div>

                          <details class="text-xs pt-1">
                            <summary class="touch-target text-indigo-600 dark:text-indigo-400 font-bold cursor-pointer hover:underline">
                              🔓 Xem đáp án chuẩn & Lời giải
                            </summary>
                            <div class="pt-2 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 space-y-1.5 mt-2">
                              <div class="hanzi-text text-sm font-bold text-emerald-950 dark:text-emerald-100">✅ Đáp án: ${r.answer}</div>
                              <p class="text-slate-700 dark:text-slate-300">${r.explain}</p>
                              ${r.audio.length ? `
                                <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(r.audio)}, 'Giải thích ôn tập')" class="touch-target px-3 py-1 rounded bg-emerald-700 text-white font-semibold">
                                  🔊 Nghe giảng giải đáp án
                                </button>
                              ` : ''}
                            </div>
                          </details>
                        </div>
                      `).join('')}
                    </div>
                  </details>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      // === E. MÀN HÌNH TRA CỨU TỪ VỰNG ===
      renderSearchView() {
        const query = AppStore.searchQuery.toLowerCase().trim();
        const progress = Storage.getProgress();

        let allWords = [];
        AppStore.lessons.forEach(l => {
          l.groups.forEach(g => {
            g.words.forEach(w => {
              allWords.push({ ...w, lessonId: l.id, lessonTitle: l.title, groupId: g.id, groupTitle: g.title });
            });
          });
        });

        if (query) {
          allWords = allWords.filter(w =>
            w.hanzi.toLowerCase().includes(query) ||
            w.pinyin.toLowerCase().includes(query) ||
            w.coreMeaning.toLowerCase().includes(query)
          );
        }

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm space-y-3">
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Tra Cứu Từ Vựng</h2>
              <div class="relative">
                <input type="text" oninput="Renderer.onSearchInput(this.value)" value="${Renderer.escapeHtml(AppStore.searchQuery)}" placeholder="Nhập chữ Hán (右, 开车), Pinyin (kaiche) hoặc nghĩa..." class="w-full px-4 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div class="text-xs text-slate-400">Tìm thấy ${allWords.length} từ vựng từ học liệu.</div>
            </div>

            <div class="grid gap-3">
              ${allWords.map(w => {
                const isDone = Boolean(progress.completedWords[w.id]);
                return `
                  <div onclick="Router.navigate('lesson', { lessonId: '${w.lessonId}', groupId: '${w.groupId}', wordId: '${w.id}' })"
                    class="cursor-pointer bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 hover:border-indigo-400 transition flex items-center justify-between gap-4 shadow-sm">
                    <div class="flex items-center gap-4">
                      <div class="w-14 h-14 rounded-xl bg-indigo-50 dark:bg-indigo-950 flex items-center justify-center text-2xl font-black text-indigo-600 dark:text-indigo-400 hanzi-text shrink-0">
                        ${w.hanzi}
                      </div>
                      <div>
                        <div class="text-xs text-slate-400 font-mono">${w.pinyin}</div>
                        <div class="text-base font-bold text-slate-900 dark:text-white">${w.coreMeaning}</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">${w.groupTitle}</div>
                      </div>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">
                      ${isDone ? '✓ Đã học' : 'Chưa học'}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      // === F. MÀN HÌNH CÀI ĐẶT & QUẢN TRỊ TIẾN TRÌNH ===
      renderSettingsView() {
        const settings = Storage.getSettings();
        const voices = TTS.getVoices();
        const viVoices = voices.filter(v => v.lang.toLowerCase().startsWith('vi'));
        const zhVoices = voices.filter(v => v.lang.toLowerCase().startsWith('zh'));

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Cài Đặt & Dữ Liệu</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Tùy chỉnh giọng đọc thiết bị, giao diện và sao lưu tiến trình.</p>
            </div>

            <!-- Tùy chỉnh giọng đọc TTS -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-sm">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">1. Cấu hình giọng đọc (Web Speech API)</h3>

              <div class="grid sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Giọng Tiếng Việt (vi-VN):</label>
                  <select onchange="Renderer.onSelectVoice('vi', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
                    <option value="">Tự động chọn giọng hệ thống tốt nhất</option>
                    ${viVoices.map(v => `<option value="${v.voiceURI}" ${settings.voiceVi === v.voiceURI ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Giọng Tiếng Trung (zh-CN):</label>
                  <select onchange="Renderer.onSelectVoice('zh', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
                    <option value="">Tự động chọn giọng hệ thống tốt nhất</option>
                    ${zhVoices.map(v => `<option value="${v.voiceURI}" ${settings.voiceZh === v.voiceURI ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Tốc độ đọc mặc định:</label>
                <div class="flex gap-2">
                  ${[0.75, 0.9, 1.0, 1.15, 1.25].map(r => `
                    <button onclick="Renderer.onSetDefaultRate(${r})" class="touch-target px-3 py-1.5 rounded-xl border text-xs font-bold ${Number(settings.rate) === r ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}">${r}×</button>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Tùy chỉnh Giao diện -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-sm">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">2. Giao diện & Chữ hiển thị</h3>
              <div class="grid grid-cols-3 gap-3">
                <button onclick="Renderer.setTheme('light')" class="touch-target p-3 rounded-xl border text-xs font-bold ${settings.theme === 'light' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950 text-indigo-700' : 'border-slate-200 dark:border-slate-700'}">☀️ Sáng</button>
                <button onclick="Renderer.setTheme('dark')" class="touch-target p-3 rounded-xl border text-xs font-bold ${settings.theme === 'dark' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950 text-indigo-700' : 'border-slate-200 dark:border-slate-700'}">🌙 Tối</button>
                <button onclick="Renderer.setTheme('system')" class="touch-target p-3 rounded-xl border text-xs font-bold ${settings.theme === 'system' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950 text-indigo-700' : 'border-slate-200 dark:border-slate-700'}">🖥 Tự động</button>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Cỡ chữ giao diện:</label>
                <div class="flex gap-2">
                  <button onclick="Renderer.setFontSize('15')" class="touch-target px-3.5 py-1.5 rounded-xl border text-xs ${settings.fontSize === '15' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">Nhỏ (15px)</button>
                  <button onclick="Renderer.setFontSize('16')" class="touch-target px-3.5 py-1.5 rounded-xl border text-xs ${settings.fontSize === '16' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">Vừa (16px)</button>
                  <button onclick="Renderer.setFontSize('18')" class="touch-target px-3.5 py-1.5 rounded-xl border text-xs ${settings.fontSize === '18' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">Lớn (18px)</button>
                </div>
              </div>
            </div>

            <!-- Sao lưu dữ liệu -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-3 shadow-sm">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">3. Quản trị tiến trình học tập</h3>
              <p class="text-xs text-slate-500">Dữ liệu được lưu trữ trực tiếp trên trình duyệt của bạn.</p>
              <div class="flex flex-wrap gap-2 pt-1">
                <button onclick="Storage.exportBackupJSON()" class="touch-target px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">
                  📥 Xuất bản sao (.json)
                </button>
                <label class="touch-target px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-800 dark:text-slate-200 text-xs font-bold cursor-pointer inline-flex items-center">
                  📤 Nhập bản sao
                  <input type="file" accept=".json" onchange="Renderer.onImportBackup(event)" class="hidden" />
                </label>
                <button onclick="Renderer.confirmReset()" class="touch-target px-4 py-2 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 text-xs font-bold hover:bg-rose-100">
                  ⚠️ Xóa toàn bộ tiến độ
                </button>
              </div>
            </div>
          </div>
        `;
      },

      // === ACTION HANDLERS ===
      escapeJsonAttr(obj) {
        return JSON.stringify(obj || []).replace(/"/g, '&quot;');
      },

      onSelectGroup(groupId) {
        if (!AppStore.currentLesson) return;
        const grp = AppStore.currentLesson.groups.find(g => g.id === groupId);
        if (grp) {
          AppStore.currentGroup = grp;
          AppStore.currentWord = grp.words[0] || null;
          this.renderCurrentView();
        }
      },

      playSequentialLecture(wordId) {
        if (!AppStore.currentGroup) return;
        const w = AppStore.currentGroup.words.find(it => it.id === wordId);
        if (!w) return;

        const queue = [];
        queue.push(...w.introAudio);
        queue.push(...w.meaning.audio);
        w.structures.forEach(st => queue.push(...st.audio));
        queue.push({ lang: "vi-VN", text: "Tiếp theo là các câu ví dụ thực tế:" });
        w.examples.forEach(ex => {
          queue.push({ lang: "zh-CN", text: ex.zh, pause: 1200 });
          queue.push({ lang: "vi-VN", text: ex.vi, pause: 600 });
        });
        w.traps.forEach(t => queue.push(...t.audio));
        if (w.summaryAudio && w.summaryAudio.length) {
          queue.push(...w.summaryAudio);
        } else if (w.summary) {
          queue.push({ lang: "vi-VN", text: "Tổng kết cách dùng: " + w.summary });
        }
        queue.push({
          lang: "vi-VN",
          text: "Đã kết thúc bài giảng lý thuyết. Hệ thống tự động dừng lại để bạn luyện tập đặt câu hoặc làm bài kiểm tra."
        });

        TTS.playQueue(queue, `Giảng tuần tự: #${w.index} (${w.hanzi})`);
      },

      checkTrapMiniQuiz(wordId, trapIdx, optionIdx) {
        if (!AppStore.currentGroup) return;
        const w = AppStore.currentGroup.words.find(it => it.id === wordId);
        if (!w || !w.traps[trapIdx] || !w.traps[trapIdx].checkQuestion) return;

        const q = w.traps[trapIdx].checkQuestion;
        const fbEl = document.getElementById(`trap-feedback-${wordId}-${trapIdx}`);
        if (!fbEl) return;

        fbEl.classList.remove('hidden');
        if (optionIdx === q.correct) {
          fbEl.className = "p-2.5 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-900 dark:bg-emerald-950 dark:text-emerald-200";
          fbEl.innerHTML = `🎉 Chính xác! ${q.explain}`;
        } else {
          fbEl.className = "p-2.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200";
          fbEl.innerHTML = `💡 Chưa đúng: ${q.explain}`;
        }
      },

      toggleCompleteWord(wordId) {
        const progress = Storage.getProgress();
        if (progress.completedWords[wordId]) {
          delete progress.completedWords[wordId];
        } else {
          progress.completedWords[wordId] = Date.now();
          if (!progress.reviewsSchedule[wordId]) {
            progress.reviewsSchedule[wordId] = {
              stage: 1,
              dueDate: Date.now() + 1 * 24 * 60 * 60 * 1000,
              history: []
            };
          }
        }
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      toggleBookmark(wordId) {
        const progress = Storage.getProgress();
        progress.bookmarks[wordId] = !progress.bookmarks[wordId];
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      onSaveWordNote(wordId, note) {
        const progress = Storage.getProgress();
        progress.notes[wordId] = note;
        Storage.saveProgress(progress);
      },

      submitExerciseOption(exId, selectedIdx, correctIdx) {
        const progress = Storage.getProgress();
        progress.completedExercises[exId] = {
          selected: selectedIdx,
          isCorrect: selectedIdx === correctIdx,
          timestamp: Date.now()
        };
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      onSaveSelfUseDraft(suId, val) {
        const progress = Storage.getProgress();
        progress.selfUseAnswers[suId] = val;
        Storage.saveProgress(progress);
      },

      onSearchInput(val) {
        AppStore.searchQuery = val;
        this.renderCurrentView();
      },

      onSelectVoice(lang, voiceURI) {
        const s = Storage.getSettings();
        if (lang === 'vi') s.voiceVi = voiceURI;
        if (lang === 'zh') s.voiceZh = voiceURI;
        Storage.saveSettings(s);
      },

      onSetDefaultRate(rate) {
        const s = Storage.getSettings();
        s.rate = rate;
        Storage.saveSettings(s);
        const btn = document.getElementById('btn-audio-rate');
        if (btn) btn.textContent = `${rate}×`;
        this.renderCurrentView();
      },

      setTheme(theme) {
        const s = Storage.getSettings();
        s.theme = theme;
        Storage.saveSettings(s);
        this.applyTheme(theme);
        this.renderCurrentView();
      },

      applyTheme(theme) {
        const root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      },

      setFontSize(sizePx) {
        const s = Storage.getSettings();
        s.fontSize = sizePx;
        Storage.saveSettings(s);
        document.documentElement.style.setProperty('--app-font-size', `${sizePx}px`);
        this.renderCurrentView();
      },

      onImportBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const res = Storage.importBackupJSON(e.target.result);
          if (res.success) {
            alert("Khôi phục tiến trình học thành công!");
            location.reload();
          } else {
            alert("Lỗi nhập tệp: " + res.error);
          }
        };
        reader.readAsText(file);
      },

      confirmReset() {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử học và tiến độ đã lưu không? Thao tác này không thể hoàn tác.")) {
          Storage.resetAll();
          location.reload();
        }
      }
    };

    // 6. KHỞI TẠO ỨNG DỤNG (APP BOOTSTRAP)
    function initializeApp() {
      TTS.init();

      const settings = Storage.getSettings();
      Renderer.applyTheme(settings.theme);
      document.documentElement.style.setProperty('--app-font-size', `${settings.fontSize || '16'}px`);

      const rawLessons = DataNormalizer.findRawLessons();
      if (rawLessons && Array.isArray(rawLessons) && rawLessons.length > 0) {
        AppStore.lessons = rawLessons.map((l, idx) => DataNormalizer.normalizeLesson(l, idx)).filter(Boolean);
      }

      if (AppStore.lessons.length > 0) {
        const progress = Storage.getProgress();
        let targetLesson = AppStore.lessons.find(l => l.id === progress.lastLessonId) || AppStore.lessons[0];
        AppStore.currentLesson = targetLesson;

        let targetGroup = targetLesson.groups.find(g => g.id === progress.lastGroupId) || targetLesson.groups[0];
        AppStore.currentGroup = targetGroup;

        if (targetGroup) {
          AppStore.currentWord = targetGroup.words.find(w => w.id === progress.lastWordId) || targetGroup.words[0];
        }

        const topInd = document.getElementById('top-lesson-indicator');
        if (topInd) topInd.textContent = `${targetLesson.level} • ${targetLesson.title}`;
      }

      Router.navigate('home');
    }

    window.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
</html>
